# /etc/nginx/sites-available/kaloritim
# Kaloritim — statik site (tek HTML dosyası)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kaloritim.pet www.kaloritim.pet;

    root /var/www/kaloritim;
    index index.html;

    charset utf-8;

    # certbot HTTP-01 doğrulaması bu dizinden yapılır
    location /.well-known/acme-challenge/ {
        root /var/www/kaloritim;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML'i önbelleğe alma — mockup sık güncelleniyor,arsen mal olduğu için

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # temel güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/kaloritim.access.log;
    error_log  /var/log/nginx/kaloritim.error.log;
}
