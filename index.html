<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#E2001A">
<link rel="canonical" href="https://kaloritim.pet/">

<meta property="og:description" content="Evcil hayvanlar için vücut kompozisyonu, sıvı dengesi ve beslenme takibi. Konsept arayüz.">

<link rel="apple-touch-icon" href="logo-amblem.png">
<style>
/* ============================================================
   KALORİTİM — konsept arayüz mockup'ı
   Sahne (sayfa) teması aydınlık/karanlık uyumlu.
   Telefon içindeki uygulama teması sabit aydınlıktır (--a-*).
   ============================================================ */

:root{
  /* --- sahne (sayfa çerçevesi) --- */
  --stage-bg:#EDE7E8;
  --stage-bg-2:#E3DBDD;
  --stage-ink:#1E1619;
  --stage-ink-2:#6B5E63;
  --stage-line:#D6CBCE;
  --stage-card:#FFFFFF;
  --stage-shadow:0 40px 90px -30px rgba(60,20,28,.45), 0 4px 14px rgba(60,20,28,.10);

  /* --- uygulama paleti (tema değişse de sabit) --- */
  --a-red:#E2001A;
  --a-red-deep:#A80014;
  --a-red-soft:#FDEEF0;
  --a-ink:#171114;
  --a-ink-2:#6A5C61;
  --a-ink-3:#9B8F93;
  --a-line:#EBE4E6;
  --a-surf:#FFFFFF;
  --a-surf-2:#F7F3F4;
  --a-surf-3:#F1ECED;
  --ok:#1B9E5E;
  --ok-soft:#E8F6EE;
  --warn:#EE9A12;
  --warn-soft:#FDF2E0;
  --crit:#E2001A;
  --crit-soft:#FDEBED;
  --info:#2F6FDB;
  --info-soft:#EAF1FD;

  --ui:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  /* sayılar: teknik/monospace değil, yumuşak ve yuvarlak hatlı bir aile */
  --num:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Avenir Next",sans-serif;

  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --stage-bg:#151012;
    --stage-bg-2:#0E0A0C;
    --stage-ink:#F4EEF0;
    --stage-ink-2:#A2939A;
    --stage-line:#2B2226;
    --stage-card:#1D171A;
    --stage-shadow:0 50px 110px -35px rgba(0,0,0,.85), 0 4px 18px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --stage-bg:#151012;
  --stage-bg-2:#0E0A0C;
  --stage-ink:#F4EEF0;
  --stage-ink-2:#A2939A;
  --stage-line:#2B2226;
  --stage-card:#1D171A;
  --stage-shadow:0 50px 110px -35px rgba(0,0,0,.85), 0 4px 18px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--stage-bg);
  background-image:radial-gradient(120% 80% at 50% -10%, var(--stage-bg) 0%, var(--stage-bg-2) 100%);
  color:var(--stage-ink);
  font-family:var(--ui);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 9999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  opacity: 0.04;
}

/* ---------- üst şerit ----------
   Matın kenarındaki koyu gösterge bandını yansıtır: her iki temada da koyu
   kalır, cihazın çerçevesiyle aynı malzemedir.                              */
.topbar{background:#171114;border-bottom:1px solid rgba(255,255,255,.09)}
.topbar-in{
  max-width:1180px;margin:0 auto;padding:0 24px;min-height:66px;
  display:flex;align-items:center;gap:13px;
}
.tb-amblem{height:32px;width:auto;display:block;flex:0 0 auto}
/* logonun kendi harf formları, koyu şeritte okunsun diye beyaza çevrildi */
.tb-yazi{height:19px;width:auto;display:block;flex:0 0 auto;filter:brightness(0) invert(1)}
.tb-rule{width:1px;height:19px;background:rgba(255,255,255,.15);margin:0 3px;flex:0 0 auto}
.tb-desc{font-size:12px;color:rgba(255,255,255,.44);white-space:nowrap}

.tb-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.tb-actions button{
  position:relative;font:inherit;font-size:12.5px;font-weight:600;
  background:none;border:0;color:rgba(255,255,255,.52);
  padding:10px 12px;cursor:pointer;transition:color .16s,background .16s,border-color .16s;
}
.tb-actions button:hover{color:#fff}
.tb-actions button[aria-pressed="true"]{color:#fff}
.tb-actions button[aria-pressed="true"]::after{
  content:"";position:absolute;left:12px;right:12px;bottom:4px;height:2px;background:#E2001A;
}
.tb-actions button.tb-cta{
  margin-left:10px;padding:9px 14px;border:1px solid rgba(255,255,255,.24);
  border-radius:8px;color:rgba(255,255,255,.92);
}
.tb-actions button.tb-cta:hover{background:#E2001A;border-color:#E2001A;color:#fff}
.tb-actions button:focus-visible,
.tb-github:focus-visible{outline:2px solid #E2001A;outline-offset:2px;border-radius:6px}
.tb-github{
  display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-size:12.5px;font-weight:600;color:rgba(255,255,255,.52);
  padding:9px 11px;border-radius:8px;transition:color .16s,background .16s;
}
.tb-github svg{width:16px;height:16px;display:block;flex:0 0 auto}
.tb-github:hover{color:#fff;background:rgba(255,255,255,.1)}
@media (max-width:520px){ .tb-github span{display:none} }

@media (max-width:980px){ .tb-desc,.tb-rule{display:none} }
@media (max-width:800px){
  .tb-readout{display:none}
  .topbar-in{flex-wrap:wrap;padding:12px 18px;gap:8px}
  .tb-actions{margin-left:auto}
}

/* ---------- sahne gövdesi ---------- */
.stage{max-width:1180px;margin:0 auto;padding:0 24px 70px}
.single{display:flex;justify-content:center;padding:40px 0 0}
.hidden{display:none !important}

/* ---------- telefon ---------- */
.phone{
  width:390px;height:844px;flex:0 0 auto;
  background:#0D0A0B;border-radius:54px;padding:11px;
  box-shadow:var(--stage-shadow);position:relative;
}
.screen{
  position:relative;width:100%;height:100%;overflow:hidden;
  border-radius:44px;background:var(--a-surf-2);
  display:flex;flex-direction:column;color:var(--a-ink);
}
.island{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:112px;height:31px;background:#0D0A0B;border-radius:999px;z-index:40;
}
.statusbar{
  height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px 0;font-size:13.5px;font-weight:600;background:var(--a-surf);
  z-index:30;
}
.statusbar .sb-time{font-family:var(--num);letter-spacing:-.02em}
.statusbar .sb-icons{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}

/* app bar */
.appbar{
  flex:0 0 auto;background:var(--a-surf);padding:2px 20px 13px;
  display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--a-line);
}
.appbar .ab-amblem{height:29px;width:auto;display:block;flex:0 0 auto}
.appbar .ab-yazi{height:16px;width:auto;display:block;flex:0 0 auto;margin-left:-2px}
.appbar .spacer{flex:1}
.appbar .iconbtn{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--a-line);background:var(--a-surf);
  display:grid;place-items:center;color:var(--a-ink-2);
}
.appbar .iconbtn svg{width:16px;height:16px}

/* içerik alanı */
.views{flex:1;overflow:hidden;position:relative}
.view{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:16px 16px 26px;display:none;flex-direction:column;gap:13px;
  scrollbar-width:thin;
}
.view.is-active{display:flex}
.view > *{flex:0 0 auto}   /* kartların dikey flex içinde sıkışıp kırpılmasını önler */
.view::-webkit-scrollbar{width:5px}
.view::-webkit-scrollbar-thumb{background:#DCD3D6;border-radius:9px}

/* tab bar */
.tabbar{
  flex:0 0 auto;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--a-line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:9px 6px 22px;
}
.tabbar button{
  background:none;border:0;font:inherit;cursor:pointer;padding:4px 0 0;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--a-ink-3);font-size:10px;font-weight:600;letter-spacing:.005em;
  transition:color .16s;
}
.tabbar button svg{width:22px;height:22px;display:block}
.tabbar button[aria-selected="true"]{color:var(--a-red)}
.tabbar button:focus-visible{outline:2px solid var(--a-red);outline-offset:2px;border-radius:8px}
.homebar{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:136px;height:5px;border-radius:99px;background:#1B1416;opacity:.85;z-index:35;
}

/* ---------- kart sistemi ---------- */
.card{
  background:var(--a-surf);border:1px solid var(--a-line);border-radius:var(--r-lg);
  padding:15px;display:flex;flex-direction:column;gap:11px;
}
.card.flush{padding:0;overflow:hidden}
.sect{
  font-family:var(--num);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--a-ink-3);font-weight:600;margin:7px 2px -3px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-head > :first-child{min-width:0}   /* dar alanda kapsül değil, başlık daralsın */
.card-title{font-size:13.5px;font-weight:700;letter-spacing:-.005em}
.card-sub{font-size:11.5px;color:var(--a-ink-2);line-height:1.45}
.hint{font-size:11px;color:var(--a-ink-3);line-height:1.5}

.num{font-family:var(--num);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.025em}
.big{font-size:30px;font-weight:700;line-height:1}
.mid{font-size:20px;font-weight:700;line-height:1}
.unit{font-size:11.5px;font-weight:600;color:var(--a-ink-2);margin-left:3px;letter-spacing:0}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  font-size:10.5px;font-weight:700;letter-spacing:.01em;
  white-space:nowrap;flex:0 0 auto;
}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:#B87308}
.pill.crit{background:var(--crit-soft);color:var(--a-red)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mute{background:var(--a-surf-3);color:var(--a-ink-2)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}

/* profil paneli ve yeni hayvan formu */
.pf-satir{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--a-surf);border:1px solid var(--a-line);border-radius:12px;padding:10px 12px;cursor:pointer;
}
.pf-satir:hover{border-color:var(--a-ink-3)}
.pf-satir.sec{border-color:var(--a-red);background:var(--crit-soft)}
.pf-foto{border-radius:50%;object-fit:cover;flex:0 0 auto;border:2px solid var(--a-surf);box-shadow:0 1px 4px rgba(23,17,20,.2)}
.pf-harf{
  border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:var(--a-red);color:#fff;font-weight:700;letter-spacing:-.02em;
}
.yh-foto{display:flex;align-items:center;gap:12px;cursor:pointer}
.yh-foto .onizleme{
  width:62px;height:62px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;
  background:var(--a-surf-3);border:2px dashed var(--a-line);
}
.yh-foto .onizleme img{width:100%;height:100%;object-fit:cover}
.yh-foto .yh-ikon{font-size:24px;color:var(--a-ink-3);font-weight:300;line-height:1}

/* hayvan başlığı */
.pet{
  display:flex;align-items:center;gap:13px;
  background:linear-gradient(135deg,var(--a-red) 0%,var(--a-red-deep) 100%);
  border-radius:var(--r-lg);padding:15px;color:#fff;border:0;
}
.pet .avatar{
  width:54px;height:54px;border-radius:50%;flex:0 0 auto;
  background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);
  display:grid;place-items:center;
}
.pet{width:100%;text-align:left;font:inherit;cursor:pointer}
.pet .avatar{overflow:hidden;padding:0}
.pet .avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pet .avatar .bas-harf{font-size:21px;font-weight:700;color:#fff;letter-spacing:-.02em}
.pet .avatar svg{width:32px;height:32px}
.pet-bilgi{flex:1;min-width:0;display:block}
.pet .ad{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
.pet .meta{display:block;font-size:11.5px;opacity:.9;margin-top:2px}
.pet-degis{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.18);color:#fff;
}
.pet-degis svg{width:16px;height:16px}
.pet:hover .pet-degis{background:rgba(255,255,255,.3)}
.pet .sync{
  display:inline-flex;align-items:center;gap:5px;margin-top:7px;
  font-size:10px;font-weight:600;background:rgba(255,255,255,.16);
  padding:3px 8px;border-radius:999px;
}
.pet .sync .dot{background:#7CFFB2}

/* metrik ızgarası */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.metric{
  background:var(--a-surf);border:1px solid var(--a-line);border-radius:var(--r-md);
  padding:12px 13px;display:flex;flex-direction:column;gap:7px;
}
.metric .lbl{
  font-family:var(--num);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--a-ink-3);font-weight:600;
}
.metric .foot{font-size:10.5px;color:var(--a-ink-2)}

/* ölçek çubuğu */
.scale{height:6px;border-radius:99px;overflow:hidden;display:flex;gap:2px}
.scale i{flex:1;background:var(--a-surf-3)}
.scale i.on{background:currentColor}
.track{height:6px;border-radius:99px;background:var(--a-surf-3);overflow:hidden}
.track b{display:block;height:100%;border-radius:99px;background:var(--a-red)}
.track.g b{background:var(--ok)} .track.y b{background:var(--warn)} .track.b b{background:var(--info)}

/* kase durumu */
.bowl{display:flex;gap:13px;align-items:center}
.bowl .viz{width:104px;height:78px;flex:0 0 auto}
.legend{display:flex;flex-direction:column;gap:6px;font-size:11px}
.legend div{display:flex;align-items:center;gap:7px;color:var(--a-ink-2)}
.legend b{color:var(--a-ink);font-weight:600}
.swatch{width:9px;height:9px;border-radius:3px;flex:0 0 auto}

/* halka göstergeler */
.rings{display:flex;justify-content:space-around;padding:4px 0 2px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring .cap{font-size:11px;color:var(--a-ink-2);font-weight:600}
.ring .amount{font-size:9.5px;color:var(--a-ink-3);font-family:var(--num)}
.ring svg{transform:rotate(-90deg)}
.ring .wrap{position:relative;width:96px;height:96px;display:grid;place-items:center}
.ring .wrap .val{position:absolute;text-align:center;line-height:1.05}
.ring .wrap .val .n{font-family:var(--num);font-size:19px;font-weight:700;letter-spacing:-.03em}
.ring .wrap .val .u{font-size:9.5px;color:var(--a-ink-2);font-weight:600}

/* liste satırları */
.rows{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;gap:11px;padding:12px 15px;
  border-bottom:1px solid var(--a-line);
}
.row:last-child{border-bottom:0}
.row .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}
.row .ic svg{width:17px;height:17px}
.row .txt{flex:1;min-width:0}
.row .t1{font-size:12.5px;font-weight:600;letter-spacing:-.005em}
.row .t2{font-size:11px;color:var(--a-ink-2);margin-top:2px;line-height:1.42}
.row .val{font-family:var(--num);font-size:13px;font-weight:700;letter-spacing:-.02em;text-align:right}
.row .val small{display:block;font-size:9.5px;font-weight:600;color:var(--a-ink-3);letter-spacing:0}
.chev{color:var(--a-ink-3);flex:0 0 auto}
.chev svg{width:14px;height:14px;display:block}

/* köpek silueti + bölge değerleri */
.siluet{
  position:relative;width:100%;max-width:288px;margin:4px auto 8px;
  aspect-ratio:325/263;
}
.siluet img{width:100%;height:100%;display:block;object-fit:contain}
.siluet.kedi img{filter:brightness(1.35)}   /* kedi görseli daha koyu geliyor */
.siluet-zemin{
  position:absolute;left:8%;right:8%;bottom:-2%;height:9px;border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(23,17,20,.16) 0%, rgba(23,17,20,0) 72%);
}
.siluet-pt{
  position:absolute;transform:translate(-50%,-50%);
  min-width:27px;height:27px;padding:0 6px;border-radius:999px;
  display:grid;place-items:center;color:#fff;
  font-family:var(--num);font-variant-numeric:lining-nums tabular-nums;
  font-size:11px;font-weight:700;letter-spacing:-.02em;
  border:2px solid var(--a-surf);box-shadow:0 2px 7px rgba(23,17,20,.3);
}

/* inbody tarzı bölümsel satır */
.seg{display:flex;flex-direction:column;gap:6px}
.seg .top{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px}
.seg .top b{font-weight:600}
.seg .top .v{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:-.02em}
.bararea{position:relative;height:16px;background:var(--a-surf-3);border-radius:5px;overflow:hidden}
.bararea .band{position:absolute;top:0;bottom:0;background:rgba(27,158,94,.13);border-left:1px dashed rgba(27,158,94,.5);border-right:1px dashed rgba(27,158,94,.5)}
.bararea .fill{position:absolute;top:3px;bottom:3px;left:0;border-radius:4px;background:var(--a-red)}
.bararea .fill.ok{background:var(--ok)} .bararea .fill.warn{background:var(--warn)}
.axis{display:flex;justify-content:space-between;font-family:var(--num);font-size:8.5px;color:var(--a-ink-3);letter-spacing:.04em}

/* segment kontrol */
.segctl{
  display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;
  background:var(--a-surf-3);border-radius:11px;
}
.segctl button{
  font:inherit;font-size:11.5px;font-weight:600;border:0;background:none;color:var(--a-ink-2);
  padding:7px 0;border-radius:8px;cursor:pointer;transition:background .16s,color .16s;
}
.segctl button[aria-pressed="true"]{background:var(--a-surf);color:var(--a-ink);box-shadow:0 1px 3px rgba(23,17,20,.13)}
.segctl button:focus-visible{outline:2px solid var(--a-red);outline-offset:1px}

/* grafik kutusu */
.chart{width:100%;display:block}
.chart-legend{display:flex;gap:13px;font-size:10.5px;color:var(--a-ink-2)}
.chart-legend span{display:flex;align-items:center;gap:5px}
.delta{font-family:var(--num);font-size:11px;font-weight:700;letter-spacing:-.01em}
.delta.up{color:var(--crit)} .delta.down{color:var(--info)} .delta.good{color:var(--ok)}

/* uyarı kartı */
.alert{
  display:flex;gap:11px;padding:13px 14px;border-radius:var(--r-md);
  border:1px solid var(--a-line);background:var(--a-surf);align-items:flex-start;
}
.alert .bar{width:3px;border-radius:99px;align-self:stretch;flex:0 0 auto}
.alert .t1{font-size:12.5px;font-weight:700;letter-spacing:-.005em}
.alert .t2{font-size:11.5px;color:var(--a-ink-2);margin-top:3px;line-height:1.5}
.alert .when{font-family:var(--num);font-size:9.5px;color:var(--a-ink-3);margin-top:6px;letter-spacing:.03em}
.alert.crit{background:var(--crit-soft);border-color:#F7CDD3}
.alert.warn{background:var(--warn-soft);border-color:#F5E0BC}
.alert.ok{background:var(--ok-soft);border-color:#C9E9D7}

/* topper çipleri */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:var(--r-md);
  border:1px solid var(--a-line);background:var(--a-surf-2);font-size:11.5px;font-weight:600;
}
.chip .q{font-family:var(--num);color:var(--a-ink-2);font-weight:700}
.chip.add{border-style:dashed;color:var(--a-ink-3);background:none}

/* geçiş anahtarı */
.sw{width:40px;height:24px;border-radius:99px;background:var(--a-surf-3);position:relative;flex:0 0 auto}
.sw.on{background:var(--ok)}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.sw.on i{left:18px}

/* ---------- açılır ayar satırları ve kontroller ---------- */
.rowgrp{border-bottom:1px solid var(--a-line)}
.rowgrp:last-child{border-bottom:0}
.rowgrp .row{border:none;width:100%;font:inherit;color:inherit;text-align:left;background:none;cursor:pointer}
.rowgrp .row:hover{background:var(--a-surf-2)}
.rowgrp .row:focus-visible{outline:2px solid var(--a-red);outline-offset:-2px}
.rowgrp .chev svg{transition:transform .18s}
.rowgrp.open .chev svg{transform:rotate(90deg)}
.rowgrp.open .row{background:var(--a-surf-2)}
.detail{display:none;flex-direction:column;gap:11px;padding:3px 15px 16px;background:var(--a-surf-2)}
.rowgrp.open .detail{display:flex}
.flabel{font-size:11.5px;font-weight:700;letter-spacing:-.005em}
.fhint{font-size:10.5px;color:var(--a-ink-3);line-height:1.5}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fstack{display:flex;flex-direction:column;gap:5px}
.tinput{
  width:100%;font:inherit;font-size:12.5px;padding:9px 11px;border:1px solid var(--a-line);
  border-radius:9px;background:var(--a-surf);color:var(--a-ink);
}
.tinput:focus{outline:2px solid var(--a-red);outline-offset:1px;border-color:transparent}
input[type=range]{width:100%;accent-color:var(--a-red);height:22px}
.btn{
  font:inherit;font-size:12px;font-weight:600;padding:9px 13px;border-radius:9px;
  border:1px solid var(--a-line);background:var(--a-surf);color:var(--a-ink);cursor:pointer;
}
.btn:hover{background:var(--a-surf-3)}
.btn.primary{background:var(--a-red);border-color:var(--a-red);color:#fff}
.btn.primary:hover{background:var(--a-red-deep)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:2px solid var(--a-red);outline-offset:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--a-line);border-radius:9px;overflow:hidden;background:var(--a-surf)}
.stepper button{width:30px;height:30px;border:0;background:none;font:inherit;font-size:15px;font-weight:700;color:var(--a-red);cursor:pointer;line-height:1}
.stepper button:disabled{color:var(--a-ink-3);cursor:default}
.stepper span{min-width:48px;text-align:center;font-family:var(--num);font-size:11.5px;font-weight:700}
/* mama seçim satırı */
.mamaopt{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  font:inherit;color:inherit;text-align:left;cursor:pointer;
  background:var(--a-surf);border:1px solid var(--a-line);border-radius:10px;padding:10px 12px;
}
.mamaopt:hover{border-color:var(--a-ink-3)}
.mamaopt.sec{border-color:var(--a-red);background:var(--crit-soft)}
.mamaopt.sec .flabel{color:var(--a-red)}
.mamaopt:focus-visible{outline:2px solid var(--a-red);outline-offset:1px}
.rc-disi{
  display:inline-block;vertical-align:1px;margin-left:5px;
  background:var(--warn-soft);color:#B87308;border-radius:5px;
  padding:1px 5px;font-size:9px;font-weight:700;letter-spacing:.02em;
}
.tar-marka-uyari{
  display:flex;gap:9px;align-items:flex-start;
  background:rgba(238,154,18,.18);border:1px solid rgba(238,154,18,.5);
  border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.5;color:#fff;
}
.tar-marka-uyari .ikon{
  width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:#EE9A12;color:#241a06;font-weight:800;font-size:12px;margin-top:1px;
}
.tar-marka-uyari b{display:block;margin-bottom:2px}
/* listede olmayan mama ekleme */
.mamaekle{
  display:flex;align-items:center;gap:11px;width:100%;
  font:inherit;color:inherit;text-align:left;cursor:pointer;
  background:none;border:1px dashed var(--a-line);border-radius:10px;padding:11px 12px;
}
.mamaekle:hover{border-color:var(--a-red);background:var(--crit-soft)}
.mamaekle:focus-visible{outline:2px solid var(--a-red);outline-offset:1px}
.mamaekle .arti{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--crit-soft);color:var(--a-red);font-size:17px;font-weight:700;line-height:1;
}
.mamaform{
  display:flex;flex-direction:column;gap:10px;
  background:var(--a-surf-2);border:1px solid var(--a-line);border-radius:12px;padding:13px;
}
.sw{cursor:pointer;border:0;padding:0}
.sw i{transition:left .16s}
/* barkod tarayıcı */
.tarayici{position:absolute;inset:0;z-index:50;background:#0C0A0B;display:flex;flex-direction:column}
.tarayici video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tar-ust{
  position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:56px 18px 14px;color:#fff;
  background:linear-gradient(180deg,rgba(12,10,11,.92) 0%,rgba(12,10,11,.55) 70%,transparent 100%);
}
.tar-ust .t1{font-size:14px;font-weight:700}
.tar-ust .t2{font-size:11px;opacity:.7;margin-top:2px}
.tar-kapat{
  font:inherit;font-size:12px;font-weight:600;color:#fff;cursor:pointer;flex:0 0 auto;
  background:rgba(255,255,255,.16);border:0;border-radius:999px;padding:8px 14px;
}
.tar-orta{position:relative;z-index:2;flex:1;display:grid;place-items:center;padding:0 34px}
.tar-cerceve{
  width:100%;aspect-ratio:1.5;border-radius:14px;position:relative;
  box-shadow:0 0 0 2000px rgba(12,10,11,.5);
}
.tar-cerceve i{position:absolute;width:26px;height:26px;border:3px solid #fff;border-radius:3px}
.tar-cerceve i:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:12px}
.tar-cerceve i:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:12px}
.tar-cerceve i:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:12px}
.tar-cerceve i:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:12px}
.tar-cizgi{
  position:absolute;left:8px;right:8px;height:2px;background:var(--a-red);
  box-shadow:0 0 12px 2px rgba(226,0,26,.8);animation:tarama 2.1s ease-in-out infinite;
}
@keyframes tarama{0%,100%{top:12%}50%{top:88%}}
.tar-alt{
  position:relative;z-index:2;padding:16px 18px 30px;color:#fff;text-align:center;
  background:linear-gradient(0deg,rgba(12,10,11,.92) 0%,rgba(12,10,11,.55) 70%,transparent 100%);
}
.tar-durum{font-size:12.5px;font-weight:600;min-height:18px}
.tar-kod{
  font-family:var(--num);font-variant-numeric:lining-nums tabular-nums;
  font-size:15px;font-weight:700;letter-spacing:.06em;margin-top:6px;
}
.tar-elle{
  margin-top:12px;font:inherit;font-size:12px;font-weight:600;color:#fff;cursor:pointer;
  background:none;border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:9px 14px;
}
.tar-elle:hover{background:rgba(255,255,255,.12)}
.tar-form{display:flex;flex-direction:column;gap:9px;margin-top:12px;text-align:left}
.tar-urun{
  display:flex;align-items:center;gap:11px;padding:9px 10px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;
}
.tar-urun img,.tar-urun .yer{
  width:42px;height:42px;border-radius:8px;flex:0 0 auto;object-fit:contain;
  background:rgba(255,255,255,.9);
}
.tar-besin{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;
}
.tar-besin .baslik{
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.55);font-weight:700;margin-bottom:2px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.tar-besin .baslik button{
  font:inherit;font-size:9.5px;letter-spacing:.06em;text-transform:none;
  color:rgba(255,255,255,.7);background:none;border:0;cursor:pointer;
  text-decoration:underline;padding:0;
}
.bs-satir{
  display:grid;grid-template-columns:74px 1fr 52px;gap:8px;align-items:center;
  font-size:11.5px;color:rgba(255,255,255,.82);
}
.bs-satir em{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.5)}
.bs-satir .tinput{padding:7px 9px;font-size:12px}
.bs-satir.bs-ekstra{grid-template-columns:1fr 1fr 26px}
.bs-sil{
  width:26px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.22);
  background:none;color:rgba(255,255,255,.75);font-size:15px;line-height:1;cursor:pointer;
}
.bs-sil:hover{background:rgba(226,0,26,.55);border-color:transparent;color:#fff}
.bs-ekle{
  font:inherit;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.8);cursor:pointer;
  background:none;border:1px dashed rgba(255,255,255,.28);border-radius:9px;padding:8px 10px;
}
.bs-ekle:hover{border-color:rgba(255,255,255,.6);color:#fff}
.tar-form .tinput{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.tar-form .tinput::placeholder{color:rgba(255,255,255,.45)}

/* telefon içi alt sayfa */
.sheet-wrap{
  position:absolute;inset:0;z-index:44;background:rgba(23,17,20,.42);
  display:flex;align-items:flex-end;
}
.sheet{
  width:100%;background:var(--a-surf);border-radius:22px 22px 44px 44px;
  max-height:78%;display:flex;flex-direction:column;
}
.sheet-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:16px 16px 12px;border-bottom:1px solid var(--a-line);
}
.sheet-body{
  padding:13px 16px 34px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;
}
.toast{
  position:absolute;left:50%;bottom:104px;transform:translateX(-50%);z-index:46;
  background:#1B1416;color:#fff;font-size:11.5px;font-weight:600;padding:10px 16px;border-radius:999px;
  box-shadow:0 12px 26px -10px rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:80%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}

/* =========================================================================
   A4 KLİNİK RAPOR — ekranda önizleme, yazdırırken tek sayfa PDF
   Renkler baskı için sabittir (tema değişimine bağlı değil).
   ========================================================================= */
.report-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(20,12,15,.72);
  overflow-y:auto;padding:26px 16px 60px;
}
.report-overlay.hidden{display:none}
.report-tools{
  max-width:210mm;margin:0 auto 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  color:#fff;font-size:12.5px;
}
.report-tools .grow{flex:1;font-weight:600}
.report{
  --in-red: #C8102E; --in-ink: #111; --in-line: #000; --in-line2: #D4D4D4; --in-bg: #EAEAEA;
  width:210mm;min-height:297mm;margin:0 auto;background:#fff;color:var(--in-ink);
  padding:12mm 10mm;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5pt; line-height: 1.2;
}
.report * {box-sizing:border-box;}
.in-head {display:flex; justify-content:space-between; align-items:flex-end; border-bottom: 2.5px solid var(--in-red); padding-bottom: 4px; margin-bottom: 4px;}
.in-logo {font-family: "Arial Black", sans-serif; font-size: 26pt; color: var(--in-red); letter-spacing: -1.5px; line-height: 0.9;}
.in-head-r {font-size: 7pt; color: #555; text-align: right;}

.in-id {display: grid; grid-template-columns: 1.2fr 0.7fr 0.7fr 1fr 1.2fr; border-bottom: 1.5px solid var(--in-line); margin-bottom: 10px;}
.in-id div {padding: 3px 5px; border-right: 1px solid var(--in-line2);}
.in-id div:last-child {border-right: none;}
.in-id .k {font-size: 6.5pt; color: #666; margin-bottom: 1px;}
.in-id .v {font-size: 8.5pt; font-weight: bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.in-cols {display: grid; grid-template-columns: 58% 38%; gap: 4%;}

.in-sec {margin-bottom: 12px;}
.in-sec-title {
  background: var(--in-bg); padding: 4px 6px; font-weight: bold; font-size: 8.5pt; letter-spacing: -0.01em;
  border-top: 1.5px solid var(--in-line); border-bottom: 1px solid var(--in-line); margin-bottom: 6px;
}

.in-comp {width: 100%; border-collapse: collapse; text-align: center; font-size: 7.5pt; margin-bottom: 10px;}
.in-comp th {background: var(--in-bg); padding: 4px; font-weight: normal; border: 1px solid var(--in-line2); font-size: 6.5pt; color: #444;}
.in-comp td {border: 1px solid var(--in-line2); padding: 5px; vertical-align: middle;}
.in-comp .lbl {font-weight: bold; text-align: left;}
.in-comp .val {font-weight: bold; font-size: 9.5pt; margin-bottom: 2px;}
.in-comp .rng {font-size: 6pt; color: #666;}

.in-bar {display: grid; grid-template-columns: 75px 1fr; gap: 8px; margin-bottom: 4px; align-items: center;}
.in-bar-lbl {font-size: 7.5pt; font-weight: bold; line-height: 1.1;}
.in-bar-lbl span {display: block; font-weight: normal; font-size: 6pt; color: #666;}
.in-bar-area {position: relative; display: flex; flex-direction: column;}
.in-bar-scale {display: flex; justify-content: space-between; font-size: 6pt; color: #666; padding: 0 4px; margin-bottom: 1px;}
.in-track {
  height: 12px; background: #fff; position: relative;
  display: flex; border: 1px solid #ccc; border-left:0; border-right:0; margin-right: 25px;
}
.in-track > div {height: 100%;}
.in-t-low {flex: 1.5; background: #F0F0F0; border-right: 1px solid #fff;}
.in-t-mid {flex: 1.5; background: #D9D9D9; border-right: 1px solid #fff;}
.in-t-high {flex: 3; background: #F0F0F0;}
.in-fill {
  position: absolute; top: 2px; bottom: 2px; left: 0; background: #222;
}
.in-num {position: absolute; right: -28px; top: 0; font-size: 8.5pt; font-weight: bold; line-height: 12px;}

.in-score {text-align: right; margin: 10px 0 20px;}
.in-score .n {font-size: 36pt; font-weight: bold; letter-spacing: -0.04em; line-height: 0.85;}
.in-score .u {font-size: 11pt; color: #444;}
.in-score-desc {font-size: 6.5pt; color: #666; margin-top: 5px; text-align: right; line-height: 1.3;}

.in-list {list-style: none; padding: 0; margin: 0 0 15px 0;}
.in-list li {display: flex; justify-content: space-between; border-bottom: 1px dotted #aaa; padding: 4px 0; font-size: 7.5pt;}
.in-list li .v {font-weight: bold;}

.in-hist {width: 100%; border-collapse: collapse; font-size: 7pt; text-align: center; margin-top: 6px;}
.in-hist th {font-weight: normal; color: #666; border-bottom: 1px solid #ccc; padding: 3px;}
.in-hist td {padding: 4px 2px; border-bottom: 1px dotted #eee; font-weight: bold;}
.in-hist td:first-child {text-align: left;}

.in-foot {display: flex; justify-content: space-between; border-top: 1.5px solid var(--in-line); padding-top: 4px; font-size: 6.5pt; color: #555; margin-top: 15mm;}

@media print{
  body{background:#fff !important}
  .stage-head,.stage,.report-tools{display:none !important}
  .report-overlay{position:static;inset:auto;padding:0;background:none;overflow:visible;display:block !important}
  .report{width:auto;min-height:0;margin:0;box-shadow:none;padding:8mm}
  @page{size:A4 portrait;margin:6mm}
}

@media (max-width:520px){
  .phone{transform:scale(.86);transform-origin:top center;margin-bottom:-120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

            <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x=".6" y=".6" width="20" height="9.8" rx="2.8" stroke="currentColor" opacity=".38"/><rect x="2.2" y="2.2" width="15.6" height="6.6" rx="1.6" fill="currentColor"/><path d="M22.3 4v3a1.9 1.9 0 0 0 0-3" fill="currentColor" opacity=".45"/></svg>

        <div class="appbar">
          <img class="ab-amblem" src="logo-amblem.png" alt="Kaloritim">

          <div class="iconbtn" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-2 8-2 8h16s-2-1-2-8"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>

/* Tohumlu sözde-rastgele üreteç: her açılışta aynı seriyi üretir,
   ama düzenli bir zikzak değil, doğal görünen dalgalanma verir.        */
function _rnd(tohum){
  let s = tohum >>> 0;
  return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}
/* n noktalı seri: son değer bugünün gerçek ölçümü, geriye doğru eğim + dalga */
function seri(n, sonDeger, donemDegisim, oynaklik, tohum, ondalik = 0){
  const r = _rnd(tohum), a = [];
  for(let i = 0; i < n; i++){
    const t = i / (n - 1);
    const temel = sonDeger - donemDegisim * (1 - t);
    const dalga = (r() - 0.46) * oynaklik * (0.35 + r() * 1.3);
    a.push(+(temel + dalga).toFixed(ondalik));
  }
  a[n - 1] = +(+sonDeger).toFixed(ondalik);
  return a;
}

function seriKur(p, t){
  const g = p, yon = g.egilim || {};
  const kur = (n, et, k) => ({
    etiket: et,
    kilo:   seri(n, g.kilo,        (yon.kilo   || 0) * k, g.kilo * 0.02, t + n,      2),
    mama:   seri(n, g.mamaAlinan,  (yon.mama   || 0) * k, g.mamaHedef * 0.22, t + n + 7),
    su:     seri(n, g.suAlinan,    (yon.su     || 0) * k, g.suHedef * 0.18, t + n + 13),
    kas:    seri(n, g.kas,         (yon.kas    || 0) * k, g.kas * 0.02, t + n + 19,  2),
    yag:    seri(n, g.yag,         (yon.yag    || 0) * k, g.yag * 0.06, t + n + 23,  2),
    kalori: seri(n, g.kaloriAlinan,(yon.kalori || 0) * k, g.kaloriHedef * 0.2, t + n + 29),
    adim:   seri(n, g.adim,        (yon.adim   || 0) * k, g.adimHedef * 0.22, t + n + 31),
    kalkma: seri(n, g.kalkma,      (yon.kalkma || 0) * k, g.kalkmaHedef * 0.2, t + n + 37),
    yatma:  seri(n, g.yatma,       (yon.yatma  || 0) * k, 0.9, t + n + 41, 1)
  });
  return { hafta: kur(7, HAFTA_ET, 0.25), ay: kur(4, AY_ET, 1), yil: kur(12, YIL_ET, 3.2) };
}

function mamaDurum(alinan,hedef){
  const o = alinan/hedef;
  if(o > 1.15) return {ad:"FAZLA TÜKETİM", renk:"var(--crit)", sinif:"crit", aciklama:"Hedefin üzerinde. Kap kırmızı yanıyor."};
  if(o < 0.85) return {ad:"AZALAN İŞTAH", renk:"var(--warn)", sinif:"warn", aciklama:"Hedefin altında. Kap sarı yanıyor."};
  return {ad:"NORMAL", renk:"var(--ok)", sinif:"ok", aciklama:"Hedef aralığında. Kap yeşil yanıyor."};
}

/* ---- noktaları yumuşak eğriyle bağlar (Catmull-Rom → kübik Bézier) ----
   t: gerginlik. Küçük değer daha sıkı, büyük değer daha yayvan eğri verir;
   0.20 civarı, veriyi aşırı taşırmadan köşeleri yuvarlar.                 */
function smoothPath(pts, t){
  t = t || 0.20;
  if(pts.length < 3) return pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=0; i<pts.length-1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1[0] + (p2[0]-p0[0])*t, c1y = p1[1] + (p2[1]-p0[1])*t;
    const c2x = p2[0] - (p3[0]-p1[0])*t, c2y = p2[1] - (p3[1]-p1[1])*t;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

/* ---- çizgi/alan grafiği ---- */
function lineChart(vals, labels, opt={}){
  const n = vals.length;
  /* nokta üstü değer etiketi: kalabalık olmasın diye 8 noktaya kadar */
  const etiketli = opt.etiketli !== undefined ? opt.etiketli : n <= 8;
  const ond = opt.ond !== undefined ? opt.ond : 0;
  const W=326, H=opt.h||(etiketli?146:132), pl=14, pr=14, pt=etiketli?24:12, pb=20;
  const min = opt.min !== undefined ? opt.min : Math.min(...vals);
  const max = opt.max !== undefined ? opt.max : Math.max(...vals);
  const lo = min - (max-min)*0.35 - 0.0001, hi = max + (max-min)*0.35 + 0.0001;
  const x = i => pl + i*(W-pl-pr)/(n-1);
  const y = v => (H-pb) - ((v-lo)/(hi-lo))*(H-pb-pt);
  const c = opt.color || "var(--a-red)";
  let line = smoothPath(vals.map((v,i)=>[x(i), y(v)]));
  let area = line + ` L${x(n-1).toFixed(1)} ${H-pb} L${x(0).toFixed(1)} ${H-pb} Z`;
  const gid = "g"+Math.random().toString(36).slice(2,8);
  let grid="";
  for(let k=0;k<=2;k++){ const gy = pt + k*(H-pb-pt)/2; grid += `<line x1="${pl-8}" y1="${gy}" x2="${W-pr+8}" y2="${gy}" stroke="var(--a-line)" stroke-width="1"/>`; }
  /* her ölçümde işaretçi; sonuncusu dolu ve halkalı */
  let noktalar = vals.map((v,i)=>{
    const son = i===n-1;
    return son
      ? `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="7" fill="${c}" opacity=".18"/>
         <circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.8" fill="${c}"/>`
      : `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="var(--a-surf)" stroke="${c}" stroke-width="1.7"/>`;
  }).join("");
  let degerler = etiketli ? vals.map((v,i)=>
    `<text x="${x(i).toFixed(1)}" y="${(y(v)-9).toFixed(1)}" font-size="8.5" font-weight="600"
       fill="${i===n-1?c:"var(--a-ink-2)"}" text-anchor="middle"
       font-family="var(--num)" style="font-variant-numeric:lining-nums tabular-nums">${nf(v,ond)}</text>`).join("") : "";
  let ticks = labels.map((l,i)=> (n>8 && i%2) ? "" :
    `<text x="${x(i).toFixed(1)}" y="${H-5}" font-size="8.5" fill="var(--a-ink-3)" text-anchor="middle" font-family="var(--num)">${l}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.aria||"grafik"}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c}" stop-opacity=".22"/><stop offset="100%" stop-color="${c}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
    ${noktalar}
    ${degerler}
    ${ticks}
  </svg>`;
}

/* ---- iki çizgili grafik (kas / yağ) ---- */
function dualChart(a, b, labels){
  const W=326,H=132,pl=14,pr=14,pt=12,pb=20;   /* kenar boşlukları lineChart ile aynı */
  const all=[...a,...b], lo=Math.min(...all)*0.92, hi=Math.max(...all)*1.06, n=a.length;
  const x=i=>pl+i*(W-pl-pr)/(n-1), y=v=>(H-pb)-((v-lo)/(hi-lo))*(H-pb-pt);
  const p=(arr)=>smoothPath(arr.map((v,i)=>[x(i), y(v)]));
  let ticks = labels.map((l,i)=> (n>8 && i%2) ? "" :
    `<text x="${x(i).toFixed(1)}" y="${H-5}" font-size="8.5" fill="var(--a-ink-3)" text-anchor="middle" font-family="var(--num)">${l}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kas ve yağ kütlesi değişimi">
    <line x1="${pl}" y1="${pt}" x2="${W-pr}" y2="${pt}" stroke="var(--a-line)"/>
    <line x1="${pl}" y1="${(pt+H-pb)/2}" x2="${W-pr}" y2="${(pt+H-pb)/2}" stroke="var(--a-line)"/>
    <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="var(--a-line)"/>
    <path d="${p(a)}" fill="none" stroke="var(--ok)" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="${p(b)}" fill="none" stroke="var(--warn)" stroke-width="1.9" stroke-linejoin="round" stroke-dasharray="5 4"/>
    ${a.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="var(--a-surf)" stroke="var(--ok)" stroke-width="1.5"/>`).join("")}
    ${b.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="var(--a-surf)" stroke="var(--warn)" stroke-width="1.5"/>`).join("")}
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(a[n-1]).toFixed(1)}" r="3.8" fill="var(--ok)"/>
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(b[n-1]).toFixed(1)}" r="3.8" fill="var(--warn)"/>
    ${ticks}
  </svg>`;
}

/* ---- sütun grafiği: hedefe göre renklenir ---- */
function barChart(vals, labels, hedef, unit){
  const W=326,H=132,pl=6,pr=6,pt=14,pb=20, n=vals.length;
  const hi = Math.max(...vals, hedef)*1.14;
  const bw = Math.min(26,(W-pl-pr)/n - 6);
  const x = i => pl + i*(W-pl-pr)/n + ((W-pl-pr)/n - bw)/2;
  const y = v => (H-pb) - (v/hi)*(H-pb-pt);
  const col = v => v/hedef>1.15 ? "var(--crit)" : (v/hedef<0.85 ? "var(--warn)" : "var(--ok)");
  const hy = y(hedef);
  let bars = vals.map((v,i)=>
    `<rect x="${x(i).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-pb-y(v)).toFixed(1)}" rx="3.5" fill="${col(v)}"/>`).join("");
  let ticks = labels.map((l,i)=> (n>8 && i%2) ? "" :
    `<text x="${(x(i)+bw/2).toFixed(1)}" y="${H-5}" font-size="8.5" fill="var(--a-ink-3)" text-anchor="middle" font-family="var(--num)">${l}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Günlük tüketim, hedefe göre renklendirilmiş">
    <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="var(--a-line)"/>
    <line x1="${pl}" y1="${hy.toFixed(1)}" x2="${W-pr}" y2="${hy.toFixed(1)}" stroke="var(--a-ink-3)" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>
    <text x="${W-pr}" y="${(hy-5).toFixed(1)}" font-size="8.5" fill="var(--a-ink-3)" text-anchor="end" font-family="var(--num)">hedef ${hedef} ${unit}</text>
    ${bars}${ticks}
  </svg>`;
}

/* obezite derecesi — ideal kiloya göre fazlalık yüzdesi */
function obezite(kilo, ideal){
  const f = (kilo-ideal)/ideal*100;
  if(f >= 30)  return {ad:"İleri obez",   derece:"Derece 3", sinif:"crit", renk:"var(--crit)", yuzde:f};
  if(f >= 15)  return {ad:"Obez",         derece:"Derece 2", sinif:"crit", renk:"var(--crit)", yuzde:f};
  if(f >= 5)   return {ad:"Fazla kilolu", derece:"Derece 1", sinif:"warn", renk:"var(--warn)", yuzde:f};
  if(f <= -10) return {ad:"Zayıf",        derece:"",         sinif:"warn", renk:"var(--warn)", yuzde:f};
  return {ad:"İdeal kilo", derece:"", sinif:"ok", renk:"var(--ok)", yuzde:f};
}

  if(b.protein) p.push("protein %"+nf(b.protein,1));
  if(b.yag)     p.push("yağ %"+nf(b.yag,1));
  if(b.kul)     p.push("kül %"+nf(b.kul,1));
  if(b.lif)     p.push("lif %"+nf(b.lif,1));

}

        <div class="card-sub">Günlük ölçüm · haftalık değişim</div>
      </div>
      <span class="delta ${kiloDelta<0?"good":"up"}">${kiloDelta<0?"−":"+"}${nf(Math.abs(kiloDelta),0)} g</span>
    </div>
    ${lineChart(hd.kilo, hd.etiket, {color:"var(--a-red)", ond:2, aria:"Haftalık ağırlık değişimi"})}
  </div>`;
}

/* ---------- 2) VÜCUT ANALİZİ (InBody mantığı) ---------- */
function viewAnaliz(){
  const toplam = PET.kilo;
  const yagsiz = toplam - VUCUT.yag;
  const tbw = SIVI.icw + SIVI.ecw;
  const ecwOran = SIVI.ecw/tbw;

  /* kompozisyon satırları — her biri kendi normal aralığına göre ölçeklenir */
  const KOMP = [
    {ad:"Toplam kas kütlesi", deger:VUCUT.kas,     birim:"kg", ideal:VUCUT.kasIdeal},
    {ad:"Yağ kütlesi",        deger:VUCUT.yag,     birim:"kg", ideal:VUCUT.yagIdeal},
    {ad:"Vücut su oranı",     deger:VUCUT.suOran,  birim:"%",  ideal:VUCUT.suOranIdeal, ondalik:1},
    {ad:"Vücut yağ oranı",    deger:VUCUT.yagOran, birim:"%",  ideal:VUCUT.yagOranIdeal, ondalik:1}
  ];
  const kompRows = KOMP.map(k=>{
    const orta = (k.ideal[0]+k.ideal[1])/2;
    const pct = k.deger/orta*100;
    const cls = pct>110 ? "" : (pct<90 ? "warn" : "ok");
    return `<div class="seg">
      <div class="top"><b>${k.ad}</b><span class="v">${nf(k.deger,k.ondalik ?? 2)} ${k.birim} <span style="color:var(--a-ink-3);font-weight:600">%${Math.round(pct)}</span></span></div>
      <div class="bararea">
        <div class="band" style="left:${(90/145*100).toFixed(1)}%;width:${(20/145*100).toFixed(1)}%"></div>
        <div class="fill ${cls}" style="width:${Math.min(pct/145*100,100).toFixed(1)}%"></div>
      </div>
      <div class="hint" style="margin-top:-2px">normal ${nf(k.ideal[0],k.ondalik ?? 2)} – ${nf(k.ideal[1],k.ondalik ?? 2)} ${k.birim}</div>
    </div>`;
  }).join("");

  const segRows = BOLGESEL.map(b=>{
    const cls = b.pct>=95?"ok":(b.pct>=90?"warn":"");
    return `<div class="seg">
      <div class="top"><b>${b.ad}</b><span class="v">${nf(b.kg,2)} kg <span style="color:var(--a-ink-3);font-weight:600">%${b.pct}</span></span></div>
      <div class="bararea">
        <div class="band" style="left:${(95/130*100).toFixed(1)}%;width:${(15/130*100).toFixed(1)}%"></div>
        <div class="fill ${cls}" style="width:${Math.min(b.pct/130*100,100).toFixed(1)}%"></div>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">Vücut kompozisyonu</div>
        <div class="card-sub">${new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"})} · mat üzerinde 8 sn ölçüm</div>
      </div>
      <span class="pill ok"><i class="dot"></i>GEÇERLİ ÖLÇÜM</span>
    </div>
    <div class="grid3">
      <div class="metric" style="border:0;padding:0">
        <div class="lbl">Toplam</div><div><span class="num mid">${nf(toplam,2)}</span><span class="unit">kg</span></div>
      </div>
      <div class="metric" style="border:0;padding:0">
        <div class="lbl">Yağsız kütle</div><div><span class="num mid">${nf(yagsiz,2)}</span><span class="unit">kg</span></div>
      </div>
      <div class="metric" style="border:0;padding:0">
        <div class="lbl">Yağ oranı</div><div><span class="num mid">${nf(VUCUT.yagOran,1)}</span><span class="unit">%</span></div>
      </div>
    </div>
    ${kompRows}
    <div class="axis"><span>55</span><span>85</span><span>100</span><span>115</span><span>145</span></div>
    <div class="hint">Yeşil bant ırka ve yaşa göre normal aralığı gösterir. Yüzdeler normal aralığın ortasına oranı ifade eder.</div>
  </div>

  <div class="sect">Bölgesel analiz</div>
  <div class="card">
    ${dogViz()}
    ${segRows}
    <div class="hint">Arka bacaklarda yağsız doku ideal aralığın altında. Kas kütlesini desteklemek için günlük 2 × 15 dk tempolu yürüyüş önerilir.</div>
  </div>

  <div class="sect">Basınç sensörü</div>
  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">Patilere düşen yük dağılımı</div>
        <div class="card-sub">Mat üzerinde ayakta durma anındaki ortalama</div>
      </div>
      <span class="pill ${BASINC.some(b=>b.pct<b.ideal[0]||b.pct>b.ideal[1])?"warn":"ok"}"><i class="dot"></i>${BASINC.some(b=>b.pct<b.ideal[0]||b.pct>b.ideal[1])?"ASİMETRİ":"DENGELİ"}</span>
    </div>
    <div class="grid2" style="gap:9px">
      ${BASINC.map(b=>{
        const dis = b.pct<b.ideal[0]||b.pct>b.ideal[1];
        return `<div class="metric" style="padding:10px 11px">
          <div class="lbl">${b.ad} pati</div>
          <div><span class="num mid" style="color:${dis?"var(--warn)":"var(--a-ink)"}">%${b.pct}</span></div>
          <div class="track ${dis?"y":"g"}"><b style="width:${(b.pct/35*100).toFixed(0)}%"></b></div>
          <div class="foot">normal %${b.ideal[0]}–${b.ideal[1]}</div>
        </div>`;
      }).join("")}
    </div>
    <div class="hint">Ön patilere düşen yük %64, arka patilere %36 — sağ arka pati normalin altında. Süreklilik gösterirse topallık veya eklem ağrısı açısından değerlendirilmelidir.</div>
  </div>

  <div class="sect">Sıvı dengesi</div>
  <div class="card">
    <div class="grid3">
      <div class="metric" style="border:0;padding:0">
        <div class="lbl">Toplam su</div><div><span class="num mid">${nf(tbw,2)}</span><span class="unit">kg</span></div>
      </div>
      <div class="metric" style="border:0;padding:0">
        <div class="lbl">Hücre içi</div><div><span class="num mid">${nf(SIVI.icw,2)}</span><span class="unit">kg</span></div>
      </div>
      <div class="metric" style="border:0;padding:0">
        <div class="lbl">Hücre dışı</div><div><span class="num mid">${nf(SIVI.ecw,2)}</span><span class="unit">kg</span></div>
      </div>
    </div>
    <div class="seg">
      <div class="top"><b>Hücre dışı sıvı oranı (ECW/TBW)</b><span class="v">${ecwOran.toFixed(3)}</span></div>
      <div class="bararea">
        <div class="band" style="left:${((0.36-0.30)/0.16*100).toFixed(1)}%;width:${(0.03/0.16*100).toFixed(1)}%"></div>
        <div class="fill ok" style="width:${((ecwOran-0.30)/0.16*100).toFixed(1)}%"></div>
      </div>
      <div class="axis"><span>0.300</span><span>0.360</span><span>0.390</span><span>0.460</span></div>
    </div>
    <div class="hint">Oran normal sınırlarda; ödem veya dehidrasyon bulgusu yok. Su tüketimi düşmeye devam ederse bu oran yükselir.</div>
  </div>

  <div class="sect">Metabolizma</div>
  <div class="card flush">
    <div class="rows">
      <div class="row">
        <div class="ic" style="background:var(--crit-soft);color:var(--a-red)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s5 4.5 5 9a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S9 11 10.5 11C12 11 12 8 12 3"/></svg>
        </div>
        <div class="txt"><div class="t1">Bazal metabolizma (RER)</div><div class="t2">Dinlenme halinde günlük enerji ihtiyacı</div></div>
        <div class="val">${PET.bmr}<small>kcal</small></div>
      </div>
      <div class="row">
        <div class="ic" style="background:var(--warn-soft);color:#B87308">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"/></svg>
        </div>
        <div class="txt"><div class="t1">Günlük kalori ihtiyacı (MER)</div><div class="t2">Kontrollü kilo verme programı · ideal kiloya göre</div></div>
        <div class="val">${PET.kaloriHedef}<small>kcal</small></div>
      </div>
      <div class="row">
        <div class="ic" style="background:var(--warn-soft);color:#B87308">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div class="txt"><div class="t1">Viseral (iç organ) yağ seviyesi</div><div class="t2">Normal sınır: 5 ve altı</div></div>
        <div class="val">${PET.visseral}<small>/ ${PET.visseralMax}</small></div>
      </div>
      <div class="row">
        <div class="ic" style="background:var(--info-soft);color:var(--info)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 5 12L17 12h4"/></svg>
        </div>
        <div class="txt"><div class="t1">Aktivite ile yakılan</div><div class="t2">${PET.adim.toLocaleString("tr-TR")} adım · ${PET.kalkma} oturup kalkma</div></div>
        <div class="val">${Math.round(PET.kaloriHedef-PET.bmr)}<small>kcal</small></div>
      </div>
    </div>
  </div>`;
}

/* ---------- 3) GRAFİKLER ---------- */
let aralik = "hafta";
const ARALIK_AD = {hafta:"Son 7 gün", ay:"Son 4 hafta", yil:"Son 12 ay"};

function viewGrafik(){
  return `
  <div class="segctl" role="group" aria-label="Zaman aralığı" id="rangeCtl">
    <button type="button" data-r="hafta" aria-pressed="${aralik==="hafta"}">Hafta</button>
    <button type="button" data-r="ay" aria-pressed="${aralik==="ay"}">Ay</button>
    <button type="button" data-r="yil" aria-pressed="${aralik==="yil"}">Yıl</button>
  </div>
  <div id="chartArea">${chartArea()}</div>`;
}

function chartArea(){
  const d = DATA[aralik];
  const kiloDelta = d.kilo[d.kilo.length-1]-d.kilo[0];
  const mamaOrt = Math.round(d.mama.reduce((a,b)=>a+b,0)/d.mama.length);
  const suOrt = Math.round(d.su.reduce((a,b)=>a+b,0)/d.su.length);
  const yagDelta = d.yag[d.yag.length-1]-d.yag[0];
  const kasDelta = d.kas[d.kas.length-1]-d.kas[0];

  return `
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Ağırlık</div><div class="card-sub">${ARALIK_AD[aralik]}</div></div>
      <span class="delta ${kiloDelta<0?"good":"up"}">${kiloDelta<0?"−":"+"}${nf(Math.abs(kiloDelta)*1000,0)} g</span>
    </div>
    <div style="display:flex;gap:22px;padding:2px 0 2px">
      <div><div class="lbl" style="font-family:var(--num);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--a-ink-3);font-weight:600">Başlangıç</div>
        <div class="num" style="font-size:16px;font-weight:700;color:var(--a-ink-2)">${nf(d.kilo[0],2)} kg</div></div>
      <div><div class="lbl" style="font-family:var(--num);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--a-ink-3);font-weight:600">Şu anki</div>
        <div class="num" style="font-size:16px;font-weight:700;color:var(--a-red)">${nf(d.kilo[d.kilo.length-1],2)} kg</div></div>
    </div>
    ${lineChart(d.kilo, d.etiket, {color:"var(--a-red)", ond:2, aria:"Ağırlık değişimi"})}
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Mama tüketimi</div><div class="card-sub">${ARALIK_AD[aralik]} · ortalama ${mamaOrt} g</div></div>
      <span class="pill ${mamaDurum(mamaOrt,PET.mamaHedef).sinif}"><i class="dot"></i>${mamaDurum(mamaOrt,PET.mamaHedef).ad}</span>
    </div>
    ${barChart(d.mama, d.etiket, PET.mamaHedef, "g")}
    <div class="chart-legend">
      <span><i class="swatch" style="background:var(--ok)"></i>Normal</span>
      <span><i class="swatch" style="background:var(--warn)"></i>Azalan iştah</span>
      <span><i class="swatch" style="background:var(--crit)"></i>Fazla tüketim</span>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Su tüketimi</div><div class="card-sub">${ARALIK_AD[aralik]} · ortalama ${suOrt} ml</div></div>
      <span class="delta down">hedef ${PET.suHedef} ml</span>
    </div>
    ${lineChart(d.su, d.etiket, {color:"var(--info)", aria:"Su tüketimi"})}
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Kas / yağ kütlesi</div><div class="card-sub">${ARALIK_AD[aralik]} · vücut kompozisyonu değişimi</div></div>
    </div>
    ${dualChart(d.kas, d.yag, d.etiket)}
    <div class="chart-legend">
      <span><i class="swatch" style="background:var(--ok)"></i>Yağsız kütle ${kasDelta<0?"−":"+"}${nf(Math.abs(kasDelta),2)} kg</span>
      <span><i class="swatch" style="background:var(--warn)"></i>Yağ kütlesi ${yagDelta<0?"−":"+"}${nf(Math.abs(yagDelta),2)} kg</span>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Alınan kalori</div><div class="card-sub">${ARALIK_AD[aralik]} · hedef ${PET.kaloriHedef} kcal/gün</div></div>
    </div>
    ${lineChart(d.kalori, d.etiket, {color:"var(--warn)", aria:"Alınan kalori"})}
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Adım sayısı</div><div class="card-sub">${ARALIK_AD[aralik]} · ortalama ${Math.round(d.adim.reduce((a,b)=>a+b,0)/d.adim.length).toLocaleString("tr-TR")} adım</div></div>
    </div>
    ${barChart(d.adim, d.etiket, PET.adimHedef, "adım")}
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Oturup kalkma</div><div class="card-sub">${ARALIK_AD[aralik]} · ortalama ${Math.round(d.kalkma.reduce((a,b)=>a+b,0)/d.kalkma.length)} kez</div></div>
    </div>
    ${lineChart(d.kalkma, d.etiket, {color:"var(--ok)", aria:"Oturup kalkma sayısı"})}
  </div>

  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Yatma süresi</div><div class="card-sub">${ARALIK_AD[aralik]} · ortalama ${saatFmt(d.yatma.reduce((a,b)=>a+b,0)/d.yatma.length)}</div></div>
      <span class="delta ${d.yatma[d.yatma.length-1]>PET.yatmaHedef?"up":"good"}">üst sınır ${PET.yatmaHedef} sa</span>
    </div>
    ${lineChart(d.yatma, d.etiket, {color:"var(--warn)", ond:1, aria:"Günlük yatma süresi"})}
  </div>

  <div class="card">
    <div class="card-title">Dönem özeti</div>
    <div class="rows" style="margin:0 -15px -15px">
      <div class="row"><div class="txt"><div class="t1">En düşük mama günü</div><div class="t2">${d.etiket[d.mama.indexOf(Math.min(...d.mama))]}</div></div><div class="val">${Math.min(...d.mama)}<small>g</small></div></div>
      <div class="row"><div class="txt"><div class="t1">En düşük su günü</div><div class="t2">${d.etiket[d.su.indexOf(Math.min(...d.su))]}</div></div><div class="val">${Math.min(...d.su)}<small>ml</small></div></div>
      <div class="row"><div class="txt"><div class="t1">En hareketsiz gün</div><div class="t2">${d.etiket[d.adim.indexOf(Math.min(...d.adim))]}</div></div><div class="val">${Math.min(...d.adim).toLocaleString("tr-TR")}<small>adım</small></div></div>
      <div class="row"><div class="txt"><div class="t1">Hedefe uyum</div><div class="t2">Kalori hedefinin ±%10 bandında geçen gün</div></div><div class="val">%${Math.round(d.kalori.filter(k=>Math.abs(k-PET.kaloriHedef)/PET.kaloriHedef<=0.1).length/d.kalori.length*100)}<small>uyum</small></div></div>
    </div>
  </div>`;
}

/* ---------- 4) UYARILAR ---------- */
function viewUyari(){
  const ikon = {
    crit:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 8v5"/><path d="M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></svg>`,
    warn:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4"/><path d="M12 17.2v.01"/></svg>`,
    info:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.8v.01"/></svg>`,
    ok:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.6 2.6L16 9.6"/></svg>`
  };
  const renk = {crit:"var(--crit)", warn:"var(--warn)", info:"var(--info)", ok:"var(--ok)"};
  const aktif = UYARILAR.filter(u=>u.tip==="crit"||u.tip==="warn");
  const digerleri = UYARILAR.filter(u=>u.tip!=="crit"&&u.tip!=="warn");

  const kart = u => `<div class="alert ${u.tip}">
      <i class="bar" style="background:${renk[u.tip]}"></i>
      <span style="color:${renk[u.tip]};flex:0 0 auto;margin-top:1px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none">${ikon[u.tip].replace(/^<svg[^>]*>|<\/svg>$/g,"")}</svg></span>
      <div><div class="t1">${u.baslik}</div><div class="t2">${u.metin}</div><div class="when">${u.zaman}</div></div>
    </div>`;

  return `
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Bugünün durumu</div><div class="card-sub">${aktif.length} uyarı ilgi bekliyor</div></div>
      <span class="pill warn"><i class="dot"></i>TAKİPTE</span>
    </div>
    <div class="grid2" style="gap:9px">
      <div class="metric" style="border:0;padding:0">
        <div class="lbl">Mama</div><div><span class="num mid" style="color:var(--warn)">%${Math.round(PET.mamaAlinan/PET.mamaHedef*100)}</span></div>
        <div class="foot">az yedi · ${PET.mamaAlinan} / ${PET.mamaHedef} g</div>
      </div>
      <div class="metric" style="border:0;padding:0">
        <div class="lbl">Su</div><div><span class="num mid" style="color:var(--crit)">%${Math.round(PET.suAlinan/PET.suHedef*100)}</span></div>
        <div class="foot">az su içti · ${PET.suAlinan} / ${PET.suHedef} ml</div>
      </div>
      <div class="metric" style="border:0;padding:0">
        <div class="lbl">Adım</div><div><span class="num mid" style="color:var(--warn)">%${Math.round(PET.adim/PET.adimHedef*100)}</span></div>
        <div class="foot">hedefin altında</div>
      </div>
      <div class="metric" style="border:0;padding:0">
        <div class="lbl">Yatma</div><div><span class="num mid" style="color:var(--warn);font-size:17px">${saatFmt(PET.yatma)}</span></div>
        <div class="foot">üst sınır ${PET.yatmaHedef} sa</div>
      </div>
    </div>
  </div>

  <div class="sect">İlgi bekleyen</div>
  ${aktif.map(kart).join("")}

  <div class="sect">Geçmiş kayıtlar</div>
  ${digerleri.map(kart).join("")}

  <div class="card">
    <div class="card-title">Uyarı eşikleri</div>
    <div class="rows" style="margin:0 -15px -15px">
      ${ESIKLER.map((x,i)=>`<div class="row">
        <div class="txt"><div class="t1">${x.ad}</div><div class="t2">${x.aciklama}</div></div>
        ${swHtml("e"+i,x.acik)}
      </div>`).join("")}
    </div>
  </div>`;
}

/* ---------- 5) AYARLAR ---------- */
function viewAyar(){
  const durum = durumHesapla();
  const satir = (id,ic,bg,fg,t1,t2,val,detay) => `<div class="rowgrp" data-grp="${id}">
    <button type="button" class="row" data-toggle="${id}" aria-expanded="false">
      <span class="ic" style="background:${bg};color:${fg}">${ic}</span>

tabbar.addEventListener("click", e=>{

  views.querySelectorAll(".view").forEach(v=>v.classList.toggle("is-active", v.id==="view-"+b.dataset.t));
  views.querySelector(".view.is-active").scrollTop = 0;
});

/* =========================================================================
   ETKİLEŞİM — ayar satırları, anahtarlar, seçenekler
   ========================================================================= */
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2400);
}

/* üst şeritteki cihaz okumaları — profil değiştikçe güncellenir */
function syncReadout(){   /* üst şeritte okuma kalmadı; ileride gerekirse dursun */
  const d = {kilo:nf(PET.kilo,2)+" kg", mama:PET.mamaHedef+" g", su:PET.suHedef+" ml"};
  document.querySelectorAll("[data-ro]").forEach(n=>{ n.textContent = d[n.dataset.ro]; });
}

function rerender(id){
  const v = document.getElementById("view-"+id);
  if(!v) return;
  if(id==="genel") syncReadout();
  const acik = [...v.querySelectorAll(".rowgrp.open")].map(x=>x.dataset.grp);
  const sc = v.scrollTop;
  v.innerHTML = SEKMELER.find(s=>s.id===id).render();
  acik.forEach(g=>{
    const n = v.querySelector('[data-grp="'+g+'"]');
    if(n){ n.classList.add("open"); n.querySelector("[data-toggle]").setAttribute("aria-expanded","true"); }
  });
  v.scrollTop = sc;
}

function setOpt(name,val){
  if(name==="parlaklik"){ AYAR.parlaklik=val; showToast("Kap ışığı parlaklığı: "+val); }
  else if(name==="olcum"){ AYAR.olcum=val; }
  else if(name==="program"){ AYAR.program=val; }
  else if(name==="vetSik"){ AYAR.vetSik=val; }
  else if(name==="cinsiyet"){ PET.cinsiyet=val+" · Kısırlaştırılmış"; }
  else if(name==="mama"){ AYAR.mama=val; rerender("genel"); showToast("Ana mama güncellendi"); }
  rerender("ayar");
}

views.addEventListener("click", e=>{
  /* satır aç / kapa */
  const tg = e.target.closest("[data-toggle]");
  if(tg){
    const g = tg.closest(".rowgrp");
    const acik = g.classList.toggle("open");
    tg.setAttribute("aria-expanded", acik);
    return;
  }
  /* aç-kapa anahtarı */
  const sw = e.target.closest("[data-sw]");
  if(sw){
    const k = sw.dataset.sw;
    if(k==="gece"){ AYAR.gece=!AYAR.gece; rerender("ayar"); }
    else if(k==="vet"){ AYAR.vet=!AYAR.vet; showToast(AYAR.vet?"Veteriner paylaşımı açıldı":"Veteriner paylaşımı kapatıldı"); rerender("ayar"); }
    else if(k[0]==="b"){ const i=+k.slice(1); AYAR.bildirim[i].acik=!AYAR.bildirim[i].acik; rerender("ayar"); }
    else if(k[0]==="e"){ const i=+k.slice(1); ESIKLER[i].acik=!ESIKLER[i].acik; rerender("uyari"); }
    return;
  }
  /* seçenek grubu */
  const ob = e.target.closest("[data-opt] button");
  if(ob){ setOpt(ob.closest("[data-opt]").dataset.opt, ob.dataset.v); return; }
  /* mama seçimi */
  const mo = e.target.closest("[data-mama]");
  if(mo){
    AYAR.mama = mo.dataset.mama;
    closeSheet();
    rerender("ayar"); rerender("genel");
    showToast("Mama güncellendi: Royal Canin " + AYAR.mama);
    return;
  }
  /* eylemler */
  const ac = e.target.closest("[data-act]");
  if(ac){
    const a = ac.dataset.act;
    if(a==="kalibre"){
      const bar = document.querySelector("[data-kal-bar]"), txt = document.querySelector("[data-kal-txt]");
      ac.disabled = true; ac.textContent = "Kalibre ediliyor…";
      txt.textContent = "Tartılar sıfırlanıyor…";
      bar.style.transition = "none"; bar.style.width = "0%";
      requestAnimationFrame(()=>{ bar.style.transition = "width 1.7s linear"; bar.style.width = "100%"; });
      setTimeout(()=>{
        const s = new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
        AYAR.kalibreDurum = "3 tartı da kalibre · bugün " + s;
        showToast("Kalibrasyon tamamlandı · hassasiyet ±2 g");
        rerender("ayar");
      }, 1800);
    }
    else if(a==="pdf"){ openReport(); }
    else if(a==="csv"){ showToast("CSV ölçüm geçmişi dışa aktarıldı (365 kayıt)"); }
    else if(a==="yeniHayvan"){ showToast("Yeni profil oluşturuldu · mat tanıma modunda"); }
    else if(a==="mamaSec"){ openSheet(); }
    else if(a==="mamaEkle"){ openSheet(true); }   /* panel, ekleme formu açık gelir */
    else if(a==="profilSec"){ openProfilSheet(); }
    else if(a==="yeniHayvan"){ openYeniHayvanSheet(); }
    else if(a==="sheetKapat"){ closeSheet(); }
    return;
  }
});

/* türe ve ağırlığa göre makul bir profil üretir */
function yeniProfilOlustur(g){
  const kedi = g.tur === "kedi";
  const rer = Math.round(70 * Math.pow(g.idealKilo, 0.75));
  const mer = Math.round(rer * (kedi ? 1.2 : 1.6));
  const kcalG = kedi ? 3.85 : 3.80;
  const mamaHedef = Math.round(mer / kcalG);
  const suHedef = Math.round(g.kilo * (kedi ? 45 : 50));
  const yag = +(g.kilo * (kedi ? 0.20 : 0.17)).toFixed(2);
  const kas = +(g.kilo * (kedi ? 0.63 : 0.66)).toFixed(2);
  const suOran = kedi ? 57.5 : 60.0;
  const tbw = g.kilo * suOran / 100;
  const govde = +(kas * 0.70).toFixed(2), on = +(kas * 0.075).toFixed(2), arka = +(kas * 0.09).toFixed(2);
  const adimHedef = kedi ? 3000 : Math.round(600 * Math.pow(g.kilo, 0.5) + 3000);

  const pet = {
    ad:g.ad.toUpperCase(), irk:g.irk || (kedi?"Tanımsız":"Tanımsız"), yas:g.yas || "—",
    cinsiyet:g.cinsiyet, cihaz:"Kaloritim Mat", senk:new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}),
    kilo:g.kilo, idealKilo:g.idealKilo,
    bmi:+(g.kilo / Math.pow(kedi?0.45:0.62, 2) / 10).toFixed(1),
    vsk:Math.max(1, Math.min(9, Math.round(5 + (g.kilo-g.idealKilo)/g.idealKilo*20))), vskMax:9,
    kaloriHedef:mer, kaloriAlinan:Math.round(mer*0.94),
    mamaHedef, mamaAlinan:Math.round(mamaHedef*0.94),
    suHedef, suAlinan:Math.round(suHedef*0.95),
    bmr:rer, visseral:kedi?4:3, visseralMax:10,
    adim:Math.round(adimHedef*0.97), adimHedef,
    kalkma:kedi?38:48, kalkmaHedef:kedi?40:50,
    yatma:kedi?16.2:12.8, yatmaHedef:kedi?16.0:13.0,
    kas, yag,
    egilim:{kilo:0.02, mama:2, su:4, kas:0.02, yag:-0.01, kalori:6, adim:120, kalkma:2, yatma:-0.1}
  };
  return {
    id:"p"+Date.now(), tur:g.tur, foto:g.foto || "",
    pet,
    vucut:{ kas, kasIdeal:[+(kas*0.92).toFixed(2), +(kas*1.08).toFixed(2)],
            yag, yagIdeal:[+(yag*0.75).toFixed(2), +(yag*1.2).toFixed(2)],
            suOran, suOranIdeal: kedi?[54,64]:[55,65],
            yagOran:+(yag/g.kilo*100).toFixed(1), yagOranIdeal: kedi?[15,25]:[12,20] },
    sivi:{ icw:+(tbw*0.63).toFixed(2), ecw:+(tbw*0.37).toFixed(2) },
    bolgesel:[
      {ad:"Sol ön bacak", kg:on, pct:99},{ad:"Sağ ön bacak", kg:on, pct:100},
      {ad:"Gövde", kg:govde, pct:101},
      {ad:"Sol arka bacak", kg:arka, pct:98},{ad:"Sağ arka bacak", kg:arka, pct:99}
    ],
    basinc:[
      {ad:"Sol ön", pct:kedi?29:30, ideal:kedi?[27,31]:[28,32]},
      {ad:"Sağ ön", pct:kedi?30:31, ideal:kedi?[27,31]:[28,32]},
      {ad:"Sol arka", pct:kedi?21:20, ideal:kedi?[19,23]:[18,22]},
      {ad:"Sağ arka", pct:kedi?20:19, ideal:kedi?[19,23]:[18,22]}
    ],
    mama: kedi ? "Sterilised 37" : "Mini Adult",
    uyarilar:[
      {tip:"ok", baslik:"Profil oluşturuldu", metin:`${pet.ad} için hedefler ağırlığa göre hesaplandı: günlük ${mer} kcal, ${mamaHedef} g mama, ${suHedef} ml su.`, zaman:"Az önce"},
      {tip:"info", baslik:"İlk ölçüm bekleniyor", metin:"Mat üzerine çıktığında vücut kompozisyonu ölçülecek ve değerler güncellenecek.", zaman:"Az önce"}
