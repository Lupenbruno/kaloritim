/* =========================================================================
   BARKOD / QR TARAYICI
   Tarayıcının yerleşik BarcodeDetector arayüzünü kullanır (Chrome, Edge,
   Android). Desteklenmeyen tarayıcılarda kodun elle girilmesine düşer.
   Kamera yalnızca HTTPS üzerinde açılır — site sertifikalı olduğu için sorun yok.
   ========================================================================= */
const tarayici = document.getElementById("tarayici");
let tarAkis = null, tarDongu = null;

function tarDurum(msg, kod){
  const d = tarayici.querySelector(".tar-durum"); if(d) d.textContent = msg;
  const k = tarayici.querySelector(".tar-kod"); if(k) k.textContent = kod || "";
}

async function tarayiciAc(){
  tarayici.innerHTML = `
    <video playsinline muted autoplay></video>
    <div class="tar-ust">
      <div>
        <div class="t1">Barkod ile mama ekle</div>
        <div class="t2">Paketin üzerindeki barkodu veya QR kodu okutun</div>
      </div>
      <button type="button" class="tar-kapat" data-tar="kapat">Kapat</button>
    </div>
    <div class="tar-orta">
      <div class="tar-cerceve"><i></i><i></i><i></i><i></i><div class="tar-cizgi"></div></div>
    </div>
    <div class="tar-alt">
      <div class="tar-durum">Kamera açılıyor…</div>
      <div class="tar-kod"></div>
      <button type="button" class="tar-elle" data-tar="elle">Kodu elle gir</button>
    </div>`;
  tarayici.classList.remove("hidden");

  try{
    tarAkis = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720} }, audio:false
    });
  }catch(err){
    tarDurum(err && err.name==="NotAllowedError"
      ? "Kamera izni verilmedi."
      : "Kameraya erişilemedi.");
    elleGiris();
    return;
  }
  const video = tarayici.querySelector("video");
  video.srcObject = tarAkis;
  await video.play().catch(()=>{});
  tarDurum("Barkodu çerçeveye getirin");

  /* Yol 1: tarayıcının yerleşik çözücüsü (Chrome, Edge, Android) */
  if("BarcodeDetector" in window){
    const dedektor = new BarcodeDetector({
      formats:["ean_13","ean_8","upc_a","upc_e","qr_code","code_128"]
    });
    tarDongu = setInterval(async ()=>{
      if(video.readyState < 2) return;
      try{
        const kodlar = await dedektor.detect(video);
        if(kodlar.length){ kodBulundu(String(kodlar[0].rawValue).trim()); }
      }catch(_){ /* kare atlanabilir, döngü sürer */ }
    }, 220);
    return;
  }

  /* Yol 2: iOS Safari — yerleşik çözücü yok, ZXing devreye girer */
  tarDurum("Okuyucu hazırlanıyor…");
  const hazir = await zxingYukle();
  if(!hazir){
    tarDurum("Okuyucu yüklenemedi — kodu elle girebilirsiniz.");
    elleGiris();
    return;
  }
  const Z = window.ZXing;
  const okuyucu = new Z.MultiFormatReader();
  const ipuclari = new Map();
  ipuclari.set(Z.DecodeHintType.POSSIBLE_FORMATS, [
    Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A,
    Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.CODE_128
  ]);
  ipuclari.set(Z.DecodeHintType.TRY_HARDER, true);
  okuyucu.setHints(ipuclari);

  const tuval = document.createElement("canvas");
  const ctx = tuval.getContext("2d", {willReadFrequently:true});
  tarDurum("Barkodu çerçeveye getirin");
  tarDongu = setInterval(()=>{
    if(video.readyState < 2 || !video.videoWidth) return;
    /* çözme maliyetini düşürmek için kareyi 640 piksel genişliğe indiriyoruz */
    const olcek = Math.min(1, 640/video.videoWidth);
    tuval.width  = Math.round(video.videoWidth*olcek);
    tuval.height = Math.round(video.videoHeight*olcek);
    ctx.drawImage(video, 0, 0, tuval.width, tuval.height);
    try{
      const kaynak = new Z.HTMLCanvasElementLuminanceSource(tuval);
      const bitmap = new Z.BinaryBitmap(new Z.HybridBinarizer(kaynak));
      const sonuc = okuyucu.decode(bitmap);
      if(sonuc) kodBulundu(String(sonuc.getText()).trim());
    }catch(_){ okuyucu.reset(); /* bu karede kod yok, döngü sürer */ }
  }, 300);
}

/* =========================================================================
   BESİN TABLOSU OCR
   Paketin analitik bileşenler tablosunu okuyup değerleri ayıklar.
   Tam metin doğruluğu gerekmez: anahtar kelimenin yanındaki sayıyı arar ve
   fizyolojik olarak makul aralıkta değilse reddeder.
   ========================================================================= */
let ocrIsci = null;

function tesseractYukle(){
  if(window.Tesseract) return Promise.resolve(true);
  return new Promise(res=>{
    const s = document.createElement("script");
    s.src = "tesseract/tesseract.min.js";
    s.onload = ()=>res(!!window.Tesseract);
    s.onerror = ()=>res(false);
    document.head.appendChild(s);
  });
}

async function ocrHazirla(ilerleme){
  if(ocrIsci) return ocrIsci;
  if(!(await tesseractYukle())) return null;
  ocrIsci = await window.Tesseract.createWorker("tur", 1, {
    workerPath: "tesseract/worker.min.js",
    corePath:   "tesseract/tesseract-core-simd.wasm.js",
    langPath:   "tesseract/",
    logger: m => {
      if(ilerleme && m.status === "recognizing text") ilerleme(Math.round(m.progress*100));
      else if(ilerleme && m.progress !== undefined) ilerleme(null, m.status);
    }
  });
  return ocrIsci;
}

/* okunan metinden değerleri çıkarır — Türkçe ve İngilizce etiketleri tanır */
function besinAyikla(metin){
  const t = metin.replace(/\s+/g," ").replace(/(\d)\s*,\s*(\d)/g,"$1.$2");
  /* OCR yüzde işaretini rakama çevirebiliyor ("%30" → "9530").
     Bu yüzden etiketten sonraki sayı öbeğini alıp, değer fizyolojik
     aralığa oturana kadar baştan bir hane kırpıyoruz.                    */
  const al = (re, min, max) => {
    const m = t.match(re);
    if(!m) return null;
    let ham = String(m[1]||"").replace(/[^0-9.]/g,"");
    while(ham.length){
      const v = parseFloat(ham);
      if(!isNaN(v) && v >= min && v <= max) return Math.round(v*10)/10;
      ham = ham.slice(1);
    }
    return null;
  };
  const sayiObegi = "([0-9][0-9.,]{0,6})";
  return {
    kcalKg:  al(new RegExp("([0-9]{3,5})\\s*kcal\\s*\\/?\\s*kg","i"), 1500, 5200),
    protein: al(new RegExp("protein[^0-9]{0,12}"+sayiObegi,"i"), 5, 60),
    yag:     al(new RegExp("(?:ya[ğgq][^0-9]{0,14}|fat\\s*content[^0-9]{0,10}|fat[^0-9]{0,10})"+sayiObegi,"i"), 2, 35),
    kul:     al(new RegExp("(?:ham\\s*k[üu]l|crude\\s*ash|ash)[^0-9]{0,12}"+sayiObegi,"i"), 1, 15),
    lif:     al(new RegExp("(?:ham\\s*(?:lif(?:ler)?|sel[üu]loz)|crude\\s*fibres?|fibre)[^0-9]{0,12}"+sayiObegi,"i"), 0.5, 20),
    nem:     al(new RegExp("(?:nem|moisture)[^0-9]{0,12}"+sayiObegi,"i"), 3, 20)
  };
}

const BESIN_AD = {kcalKg:"Enerji", protein:"Protein", yag:"Yağ", kul:"Ham kül", lif:"Ham lif", nem:"Nem"};
const BESIN_BIRIM = {kcalKg:"kcal/kg", protein:"%", yag:"%", kul:"%", lif:"%", nem:"%"};

/* videodan tam çözünürlüklü kare alır, OCR için kontrastı açar */
function kareAl(video){
  const c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  const x = c.getContext("2d", {willReadFrequently:true});
  x.drawImage(video, 0, 0);
  const g = x.getImageData(0,0,c.width,c.height), p = g.data;
  /* gri tonlama + kontrast germe: küçük puntolu tablo metnini belirginleştirir */
  let min = 255, max = 0;
  for(let i=0;i<p.length;i+=4){
    const l = (p[i]*0.299 + p[i+1]*0.587 + p[i+2]*0.114)|0;
    p[i]=p[i+1]=p[i+2]=l;
    if(l<min) min=l; if(l>max) max=l;
  }
  const fark = Math.max(1, max-min);
  for(let i=0;i<p.length;i+=4){
    const v = Math.min(255, Math.max(0, ((p[i]-min)*255/fark)|0));
    p[i]=p[i+1]=p[i+2]=v;
  }
  x.putImageData(g,0,0);
  return c;
}

async function besinOku(){
  const video = tarayici.querySelector("video");
  if(!video || !video.videoWidth){ tarDurum("Kamera görüntüsü yok — değerleri elle girebilirsiniz."); return; }
  const btn = tarayici.querySelector('[data-tar="besinOku"]');
  if(btn){ btn.disabled = true; btn.textContent = "Okunuyor…"; }

  tarDurum("Okuyucu hazırlanıyor…");
  const isci = await ocrHazirla((yuzde, durum)=>{
    if(yuzde !== null && yuzde !== undefined) tarDurum("Tablo okunuyor… %"+yuzde);
    else if(durum) tarDurum("Hazırlanıyor…");
  });
  if(!isci){
    tarDurum("Metin okuyucu yüklenemedi — değerleri elle girin.");
    if(btn){ btn.disabled = false; btn.textContent = "Besin tablosunu okut"; }
    return;
  }
  try{
    const kare = kareAl(video);
    const { data } = await isci.recognize(kare);
    const yeni = besinAyikla(data.text || "");
    const okunan = Object.keys(yeni).filter(k=>yeni[k] !== null);
    if(!okunan.length){
      tarDurum("Tablo okunamadı — düz tutup tekrar deneyin veya elle girin.");
      if(btn){ btn.disabled = false; btn.textContent = "Tekrar okut"; }
      return;
    }
    /* form alanları tek doğruluk kaynağı: okuma yalnızca yazar, hiçbir alanı silmez */
    besinGoster(yeni);
    const dolu = [...document.querySelectorAll("[data-bs]")].filter(a=>a.value.trim()).length;
    tarDurum(`${okunan.length} değer okundu · formda ${dolu} dolu alan`);
  }catch(err){
    tarDurum("Okuma başarısız — değerleri elle girin.");
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "Tekrar okut"; }
  }
}

/* OCR sonuçlarını forma yazar — kullanıcının elle girdiği alanlara dokunmaz */
function besinGoster(b){
  Object.keys(b).forEach(k=>{
    if(b[k] === null || b[k] === undefined) return;
    const alan = document.getElementById("bs_"+k);
    if(!alan || alan.dataset.elle) return;          /* elle yazılmışsa koru */
    alan.value = String(+(+b[k]).toFixed(k==="kcalKg"?0:1)).replace(".",",");
  });
  kcalTurev();
}

/* kcal/kg alanından kcal/g alanını türetir */
function kcalTurev(){
  const kg = document.getElementById("bs_kcalKg");
  const g  = document.getElementById("tarKcal");
  if(!kg || !g || g.dataset.elle) return;
  const v = parseFloat(String(kg.value).replace(",","."));
  if(v > 0) g.value = String(+(v/1000).toFixed(2)).replace(".",",");
}

/* formdaki tüm besin alanlarını okur */
function besinTopla(){
  const b = {};
  document.querySelectorAll("[data-bs]").forEach(a=>{
    const v = parseFloat(String(a.value).replace(",","."));
    if(!isNaN(v)) b[a.dataset.bs] = v;
  });
  const ekstra = [...document.querySelectorAll("#bsEkstra .bs-ekstra")].map(r=>({
    ad: r.querySelector(".ea").value.trim(),
    deger: r.querySelector(".ed").value.trim()
  })).filter(x=>x.ad && x.deger);
  if(ekstra.length) b.ekstra = ekstra;
  return Object.keys(b).length ? b : null;
}

/* kullanıcının kendi tanımladığı besin satırı */
function besinEkstraEkle(ad, deger){
  const kap = document.getElementById("bsEkstra");
  if(!kap) return;
  const satir = el(`<div class="bs-satir bs-ekstra">

    </div>`);

}

/* ZXing yalnızca gerektiğinde indirilir — Chrome'da hiç yüklenmez */
function zxingYukle(){
  if(window.ZXing) return Promise.resolve(true);
  return new Promise(res=>{
    const s = document.createElement("script");
    s.src = "zxing.js";
    s.onload = ()=>res(!!window.ZXing);
    s.onerror = ()=>res(false);
    document.head.appendChild(s);
  });
}

function tarayiciKapat(){
  if(tarDongu){ clearInterval(tarDongu); tarDongu = null; }
  if(tarAkis){ tarAkis.getTracks().forEach(t=>t.stop()); tarAkis = null; }
  tarayici.classList.add("hidden");
  tarayici.innerHTML = "";
  delete tarayici.dataset.kod;      /* sonraki taramaya eski veri sızmasın */
  delete tarayici.dataset.rc;
  delete tarayici.dataset.besin;
}

/* Open Pet Food Facts sorgusu — ücretsiz, anahtarsız, CORS açık.
   Ürün adı ve markayı getirir; kalori değeri çoğu kayıtta bulunmaz.        */
async function barkodSorgula(kod){
  const alanlar = "product_name,brands,quantity,image_front_small_url,nutriments";
  const url = `https://world.openpetfoodfacts.org/api/v2/product/${encodeURIComponent(kod)}.json?fields=${alanlar}`;
  const c = new AbortController();
  const zamanAsimi = setTimeout(()=>c.abort(), 6000);   /* sunumda beklemede kalmasın */
  try{
    const y = await fetch(url, {signal:c.signal});
    if(!y.ok) return null;
    const d = await y.json();
    const p = d && d.product;
    if(!p || !p.product_name) return null;
    const n = p.nutriments || {};
    const kcal100 = n["energy-kcal_100g"] ?? n["energy-kcal"] ??
                    (n["energy_100g"] ? n["energy_100g"]/4.184 : null);
    return {
      ad: p.product_name.trim(),
      marka: (p.brands||"").split(",")[0].trim(),
      miktar: p.quantity || "",
      gorsel: p.image_front_small_url || "",
      kcal: kcal100 ? +(kcal100/100).toFixed(2) : null
    };
  }catch(_){ return null; }
  finally{ clearTimeout(zamanAsimi); }
}

/* okunan kodu ürüne çevirir */
function kodBulundu(kod){
  if(tarDongu){ clearInterval(tarDongu); tarDongu = null; }
  if(navigator.vibrate) navigator.vibrate(60);

  const kayit = BARKODLAR[kod];
  const katalog = (window.RC_KATALOG || {})[kod];
  const royalCanin = RC_ONEK.some(o=>kod.startsWith(o)) || !!katalog;

  if(kayit){
    tarDurum("Ürün tanındı", kod);
    if(!MAMALAR.some(m=>m.ad.toLowerCase()===kayit.ad.toLowerCase())){
      MAMALAR.push({ad:kayit.ad, kisa:kayit.ad.split(" ")[0], kcal:kayit.kcal, not:kayit.not, barkod:kod});
    }
    AYAR.mama = kayit.ad;
    setTimeout(()=>{
      tarayiciKapat(); closeSheet();
      rerender("genel"); rerender("ayar");
      showToast("Eklendi: Royal Canin " + kayit.ad + " · " + nf(kayit.kcal,2) + " kcal/g");
    }, 650);
    return;
  }

  /* Royal Canin katalogunda var: ad ve kategori bilinir, kalori sorulur */
  if(katalog){
    tarDurum("Royal Canin " + katalog.ad, kod);
    elleGiris(kod, true, {
      ad: katalog.ad,
      kcal: katalog.kcal || null,
      gorsel: "",
      miktar: [katalog.kategori, katalog.boy].filter(Boolean).join(" · ")
    });
    return;
  }

  /* yerel katalogda yok: açık veritabanından ürünü çekmeyi dene */
  tarDurum(royalCanin ? "Ürün aranıyor…" : "Royal Canin ürünü değil — aranıyor…", kod);
  barkodSorgula(kod).then(bulgu=>{
    if(bulgu){
      const tamAd = bulgu.marka && !bulgu.ad.toLowerCase().includes(bulgu.marka.toLowerCase())
        ? `${bulgu.marka} ${bulgu.ad}` : bulgu.ad;
      tarDurum(royalCanin
        ? (bulgu.kcal ? "Ürün bulundu" : "Ürün bulundu — kalori değerini girin")
        : "Royal Canin ürünü değil", kod);
      elleGiris(kod, royalCanin, {
        ad: tamAd.replace(/\b\w/g, ch=>ch.toUpperCase()),
        kcal: bulgu.kcal,
        gorsel: bulgu.gorsel,
        miktar: bulgu.miktar
      });
    }else{
      tarDurum(royalCanin ? "Royal Canin ürünü — bilgileri tamamlayın" : "Kod okundu — bilgileri tamamlayın", kod);
      elleGiris(kod, royalCanin);
    }
  });
}

/* kamera yoksa veya ürün tanınmadıysa elle giriş */
function elleGiris(kod, royalCanin, bulgu){
  const alt = tarayici.querySelector(".tar-alt");
  if(!alt) return;                       /* tarayıcı bu arada kapatılmış olabilir */
  const btn = tarayici.querySelector(".tar-elle");
  if(btn) btn.remove();

  /* okunan kod her durumda kaydedilmeli — form önceden açılmış olsa bile */
  if(kod){
    tarayici.dataset.kod = kod;
    tarayici.dataset.rc  = royalCanin ? "1" : "";
  }
  const mevcut = alt.querySelector(".tar-form");
  if(mevcut){
    const kodAlan = document.getElementById("tarKod");
    if(kod && kodAlan){ kodAlan.value = kod; kodAlan.readOnly = true; }
    markaUyarisi(kod, royalCanin);        /* form önceden açılmış olsa da uyarı gösterilir */
    if(bulgu) bulguDoldur(bulgu);
    return;
  }
  alt.insertAdjacentHTML("beforeend", `
    <div class="tar-form">
      ${kod ? "" : `<input class="tinput" id="tarKod" inputmode="numeric" placeholder="Barkod numarası" aria-label="Barkod numarası">`}
      <input class="tinput" id="tarAd" placeholder="Ürün adı${royalCanin?" (Royal Canin)":""}" aria-label="Ürün adı">
      <input class="tinput" id="tarKcal" inputmode="decimal" placeholder="Kalori değeri — örn. 3,60" aria-label="kcal/g">

      <div class="tar-besin">
        <div class="baslik">
          Besin değerleri
          <button type="button" data-tar="besinSifirla">tümünü temizle</button>
        </div>
        ${["kcalKg","protein","yag","kul","lif","nem"].map(k=>`
          <label class="bs-satir">
            <span>${BESIN_AD[k]}</span>
            <input class="tinput" id="bs_${k}" data-bs="${k}" inputmode="decimal" placeholder="—" aria-label="${BESIN_AD[k]}">
            <em>${BESIN_BIRIM[k]}</em>
          </label>`).join("")}
        <div id="bsEkstra"></div>
        <button type="button" class="bs-ekle" data-tar="besinEkstraEkle">+ Başka değer ekle</button>
        <div class="fhint" style="color:rgba(255,255,255,.5)">
          Boş bıraktığınız alan kaydedilmez. Okunan bir değeri düzeltebilir veya silebilirsiniz.
        </div>
      </div>

      <button type="button" class="btn" data-tar="besinOku">Besin tablosunu okut</button>
      <button type="button" class="btn primary" data-tar="kaydet">Ekle ve seç</button>
    </div>`);
  if(!kod){ tarayici.dataset.kod = ""; tarayici.dataset.rc = ""; }
  markaUyarisi(kod, royalCanin);
  if(bulgu) bulguDoldur(bulgu);
  const ad = document.getElementById("tarAd");
  if(ad && !ad.value) ad.focus();
  else{ const k = document.getElementById("tarKcal"); if(k) k.focus(); }
}

/* Royal Canin dışı ürünlerde açık uyarı — form nasıl açılmış olursa olsun çalışır */
function markaUyarisi(kod, royalCanin){
  const form = tarayici.querySelector(".tar-form");
  if(!form) return;
  const mevcut = form.querySelector(".tar-marka-uyari");
  if(!kod || royalCanin){ if(mevcut) mevcut.remove(); return; }
  if(mevcut) return;
  form.insertAdjacentHTML("afterbegin", `
    <div class="tar-marka-uyari">
      <span class="ikon">!</span>
      <span>
        <b>Bu ürün Royal Canin değil.</b>
        Barkod Royal Canin kataloğunda bulunmuyor. Ürünü yine de ekleyebilirsiniz;
        besin değerlerini paketten okutmanız veya elle girmeniz gerekir.
      </span>
    </div>`);
}

/* açık veritabanından gelen bilgileri forma yerleştirir */
function bulguDoldur(b){
  const ad = document.getElementById("tarAd");
  const kcal = document.getElementById("tarKcal");
  if(ad) ad.value = b.ad || "";
  if(kcal && b.kcal) kcal.value = String(b.kcal).replace(".",",");
  const form = tarayici.querySelector(".tar-form");
  if(form && !form.querySelector(".tar-urun")){
    form.insertAdjacentHTML("afterbegin", `
      <div class="tar-urun">
        ${b.gorsel ? `<img src="${b.gorsel}" alt="">` : `<span class="yer"></span>`}
        <span class="fstack">
          <span class="flabel" style="font-weight:600;color:#fff">${b.ad}</span>
          <span class="fhint" style="color:rgba(255,255,255,.6)">
            ${b.miktar ? b.miktar + " · " : ""}${b.kcal ? nf(b.kcal,2)+" kcal/g" : "kalori değeri veritabanında yok"}
          </span>
        </span>
      </div>`);
  }
}

/* kullanıcı bir alana elle yazdıysa işaretle: sonraki OCR onu ezmesin */
tarayici.addEventListener("input", e=>{
  const a = e.target;
  if(a.matches("[data-bs], #tarKcal")){
    if(a.value.trim()) a.dataset.elle = "1"; else delete a.dataset.elle;
    if(a.dataset.bs === "kcalKg") kcalTurev();

tarayici.addEventListener("click", e=>{
  const b = e.target.closest("[data-tar]"); if(!b) return;
  const a = b.dataset.tar;
  if(a==="kapat"){ tarayiciKapat(); return; }
  if(a==="elle"){ elleGiris(); return; }
  if(a==="besinOku"){ besinOku(); return; }
  if(a==="besinEkstraEkle"){ besinEkstraEkle(); return; }
  if(a==="besinSifirla"){
    tarayici.querySelectorAll("[data-bs]").forEach(x=>{ x.value = ""; delete x.dataset.elle; });
    const kap = document.getElementById("bsEkstra"); if(kap) kap.innerHTML = "";
    tarDurum("Besin alanları temizlendi");
    return;
  }
  if(a==="kaydet"){
    const kodAlan = document.getElementById("tarKod");
    const kod = tarayici.dataset.kod || (kodAlan ? kodAlan.value.trim() : "");
    const ad = document.getElementById("tarAd").value.trim();
    const kcal = parseFloat(String(document.getElementById("tarKcal").value).replace(",","."));
    if(!ad){ tarDurum("Ürün adı boş olamaz", kod); return; }
    if(!(kcal >= 1 && kcal <= 6)){ tarDurum("Kalori değeri 1–6 kcal/g aralığında olmalı", kod); return; }
    if(MAMALAR.some(m=>m.ad.toLowerCase()===ad.toLowerCase())){ tarDurum("Bu ürün listede zaten var", kod); return; }
    const rc = tarayici.dataset.rc === "1";
    const besin = besinTopla();
    MAMALAR.push({
      ad, kisa:ad.split(" ")[0], kcal, barkod:kod, ozel:!rc, besin, rcDisi:!rc,
      not: rc ? "Royal Canin · barkodla eklendi" : "Royal Canin dışı ürün"
    });
    AYAR.mama = ad;
    tarayiciKapat(); closeSheet();
    rerender("genel"); rerender("ayar");
    showToast("Eklendi: " + ad + " · " + nf(kcal,2) + " kcal/g");
  }
});

/* panel, .views dışında durduğu için kendi dinleyicisine ihtiyaç duyar */
sheet.addEventListener("click", e=>{
  if(e.target === sheet){ closeSheet(); return; }                 /* karartılmış alana dokunuş */
  if(e.target.closest('[data-act="sheetKapat"]')){ closeSheet(); return; }

  /* profil seçimi */
  const ps = e.target.closest("[data-profil]");
  if(ps){
    profilBagla(+ps.dataset.profil);
    closeSheet();
    ["genel","analiz","grafik","uyari","ayar"].forEach(rerender);
    showToast(PET.ad + " profiline geçildi");
    return;
  }
  const pa = e.target.closest("[data-act]");
  if(pa){
    const a = pa.dataset.act;
    if(a==="yeniHayvanAc"){ openYeniHayvanSheet(); return; }
    if(a==="profilGeri"){ openProfilSheet(); return; }
    if(a==="yeniHayvanKaydet"){
      const ad = document.getElementById("yhAd").value.trim();
      const kilo = parseFloat(String(document.getElementById("yhKilo").value).replace(",","."));
      let hedef = parseFloat(String(document.getElementById("yhHedef").value).replace(",","."));
      if(!ad){ showToast("İsim boş olamaz"); return; }
      if(!(kilo > 0.3 && kilo < 120)){ showToast("Geçerli bir kilo girin (kg)"); return; }
      if(!(hedef > 0.3 && hedef < 120)) hedef = kilo;
      const tur = sheet.querySelector('[data-opt="yeniTur"] [aria-pressed="true"]');
      const cins = sheet.querySelector('[data-opt="yeniCinsiyet"] [aria-pressed="true"]');
      const onizleme = document.getElementById("yhOnizleme");
      PROFILLER.push(yeniProfilOlustur({
        ad, tur: tur ? tur.dataset.v : "kopek",
        irk: document.getElementById("yhIrk").value.trim(),
        yas: document.getElementById("yhYas").value.trim(),
        cinsiyet: cins ? cins.dataset.v : "Dişi",
        kilo, idealKilo: hedef,
        foto: (onizleme && onizleme.dataset.veri) || ""
      }));
      profilBagla(PROFILLER.length - 1);
      closeSheet();
      ["genel","analiz","grafik","uyari","ayar"].forEach(rerender);
      showToast(PET.ad + " profili oluşturuldu");
      return;
    }
  }
  /* panel içindeki seçenek grupları (tür, cinsiyet) */
  const so = e.target.closest("[data-opt] button");
  if(so){
    so.closest("[data-opt]").querySelectorAll("button")
      .forEach(x=>x.setAttribute("aria-pressed", x===so));
    return;
  }

  const ac = e.target.closest("[data-act]");
  if(ac){
    const a = ac.dataset.act, form = document.getElementById("mamaForm");
    if(a==="mamaEkleAc"){
      form.classList.remove("hidden");
      ac.classList.add("hidden");
      form.scrollIntoView({block:"nearest"});
      document.getElementById("yeniMamaAd").focus();
      return;
    }
    if(a==="mamaEkleKapat"){
      form.classList.add("hidden");
      sheet.querySelector('[data-act="mamaEkleAc"]').classList.remove("hidden");
      return;
    }
    if(a==="barkod"){ tarayiciAc(); return; }
    if(a==="mamaEkleKaydet"){
      const ad = document.getElementById("yeniMamaAd").value.trim();
      const kcal = parseFloat(String(document.getElementById("yeniMamaKcal").value).replace(",","."));
      const not = document.getElementById("yeniMamaNot").value.trim();
      if(!ad){ showToast("Ürün adı boş olamaz"); return; }
      if(!(kcal > 0)){ showToast("Kalori değeri girin (kcal/g)"); return; }
      if(kcal < 1 || kcal > 6){ showToast("Kalori değeri 1–6 kcal/g aralığında olmalı"); return; }
      if(MAMALAR.some(m=>m.ad.toLowerCase() === ad.toLowerCase())){ showToast("Bu ürün listede zaten var"); return; }
      MAMALAR.push({ad, kisa:ad.split(" ")[0], kcal, not: not || "Kullanıcı kaydı", ozel:true});
      AYAR.mama = ad;
      closeSheet();
      rerender("ayar"); rerender("genel");
      showToast("Eklendi ve seçildi: " + ad);
      return;
    }
  }

  const mo = e.target.closest("[data-mama]");
  if(mo){
    AYAR.mama = mo.dataset.mama;
    closeSheet();
    rerender("ayar"); rerender("genel");
    showToast("Mama güncellendi: " + AYAR.mama);
  }
});

function rpBar(ad, alt, deger, birim, plot, sMin, sMax, bLo, bHi, cls){
  const w = x => (((Math.min(Math.max(x,sMin),sMax)-sMin)/(sMax-sMin))*100);
  return `<div class="rp-bar">
    <span class="nm">${ad}<i>${alt}</i></span>
    <span class="rp-track">
      <span class="band" style="left:${w(bLo).toFixed(1)}%;width:${(w(bHi)-w(bLo)).toFixed(1)}%"></span>
      <span class="fill ${cls}" style="width:${w(plot).toFixed(1)}%"></span>
    </span>
    <span class="vl">${deger}<i>${birim}</i></span>
  </div>`;
}

const overlay = document.getElementById("reportOverlay");
function openReport(){
  document.getElementById("reportSheet").innerHTML = reportHTML();
  overlay.classList.remove("hidden");
  document.body.style.overflow = "hidden";
  overlay.scrollTop = 0;
}
function closeReport(){
  overlay.classList.add("hidden");
  document.body.style.overflow = "";
}
syncReadout();
document.getElementById("btnReport").addEventListener("click", openReport);
document.getElementById("btnCloseReport").addEventListener("click", closeReport);
document.getElementById("btnPrint").addEventListener("click", ()=>window.print());
overlay.addEventListener("click", e=>{ if(e.target===overlay) closeReport(); });
document.addEventListener("keydown", e=>{
  if(e.key !== "Escape") return;
  if(!tarayici.classList.contains("hidden")){ tarayiciKapat(); return; }
  if(!sheet.classList.contains("hidden")){ closeSheet(); return; }
  if(!overlay.classList.contains("hidden")) closeReport();
});
